          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        revenue_gross_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        revenue_basis:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RevenueBasisEnum'
          - $ref: '#/components/schemas/NullEnum'
        purchases_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        goods_consumed_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        stock_change_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        waste_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        unknown_shrinkage_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        stock_value_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        stock_value_as_of:
          type: string
          format: date-time
        payroll_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        payroll_basis:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PayrollBasisEnum'
