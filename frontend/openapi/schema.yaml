        Não sai o `id` da página: o endereço dela é `(documento, position)`, que é o
        que o path usa, e um segundo identificador no payload era mais uma coisa para
        o cliente escolher mal.
      properties:
        position:
          type: integer
        image_url:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        normalized:
          type: boolean
      required:
      - height
      - image_url
      - normalized
      - position
      - width
