        Uma linha do `GET /stock/alerts/waste`: o que se deitou fora, e quem.

        É do `inventory` e não do `reporting`, e a fronteira está escrita: *o
        `reporting` agrega o negócio num período e é do dono; o `inventory` lista o
        ledger para quem age sobre ele* (ADR 0034, decisão 4). Esta lista fica ao
        lado do botão que a cria e tem de chegar ao `staff` — por isso o que lhe
        falta é só o `value_eur`.

        `quantity` vem **positiva**: o sinal do ledger já foi lido, e "perdeste −2
        kg" não é uma frase.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        short_name:
          type: string
          readOnly: true
        lot_code:
          type: string
          readOnly: true
          nullable: true
        quantity:
          allOf:
          - $ref: '#/components/schemas/QuantidadeOut'
          readOnly: true
        reason:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/MotivoDeQuebraEnum'
          - $ref: '#/components/schemas/BlankEnum'
        location:
          allOf:
          - $ref: '#/components/schemas/LocalizacaoReferencia'
          readOnly: true
        created_by:
          type: string
          readOnly: true
          nullable: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        cost_status:
          allOf:
          - $ref: '#/components/schemas/EstadoDoCustoEnum'
          readOnly: true
        value_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          description: Ausente para quem não vê euros.
    DesperdicioPorMotivoOut:
      type: object
      description: Quanto se perdeu por motivo. Ordenada pelo servidor, a maior primeiro.
      properties:
        reason:
          $ref: '#/components/schemas/MotivoDeQuebraEnum'
        amount_eur:
