openapi: 3.0.3
info:
  title: StockFlow API
  version: 1.0.0
  description: 'Gestão de stock, validades, receitas e compras para restauração. Multi-tenant:
    cada pedido corre no contexto do tenant da sessão.'
paths:
  /api/v1/auth/ativar:
    post:
      operationId: auth_ativar
      description: |-
        `POST /api/v1/auth/ativar` — aceita um convite e devolve a sessão.

        É uma das seis views dispensadas de âmbito, e a razão é a do login: corre
        **antes** de existir tenant na sessão. A diferença — e é a decisão da ADR 0010 — é que
        esta view **abre** um âmbito, e o valor que o escolhe vem do **link**:
        `/ativar#<uuid-do-tenant>.<token>`. O uuid é argumento e não credencial, e
        quem concede é a política do `accounts_invitation`, que é uma política normal
        porque o link nomeia o tenant.

        `AllowAny` e não `IsAuthenticated`, e os dois casos são reais: uma conta nova
        chega aqui anónima, e uma conta que já existe tem de chegar aqui **com**
        sessão (`convite_exige_sessao`), porque a activação nunca define password
        numa conta que já tem uma.

        ## `csrf_protect` e `JSONParser`, pela razão do `SECURITY.md` §5

        Esta é exatamente a forma de endpoint que o §5 descreve: **anónimo e de
        escrita**. O `as_view()` do DRF embrulha a view em `csrf_exempt` e o
        `SessionAuthentication` só verifica o token quando **encontra** um utilizador
        na sessão — logo, sem estas duas linhas, um `POST /auth/ativar` anónimo
        nasceria sem protecção de CSRF nenhuma, como o login nasceu. O ataque aqui
        não é só *login CSRF*: é fazer o browser de quem tem o link queimar um token
        de uso único, ou aceitar um convite para um estabelecimento do atacante com a
        conta da vítima. Medido nas duas metades com `enforce_csrf_checks=True`.

        **Um endpoint dispensado de âmbito dispensa-se do âmbito e não do CSRF.**

        ## Códigos que esta view devolve

        * `400 convite_invalido` — expirado, usado, revogado, inexistente, uuid de
          tenant forjado e fragmento mal formado. **O mesmo código e o mesmo corpo**
          nos seis casos: distinguir dizia a quem experimenta um link se aquele
          estabelecimento existe e se aquele convite já foi usado;
        * `409 convite_exige_sessao` — o email convidado já tem conta com password;
        * `403 convite_de_outra_conta` — a sessão é de outra conta;
        * `400` por campo (`{"password": [...]}`) — password em falta ou fraca. É a
          segunda forma do 400 que o docstring deste módulo descreve, e sai assim
          porque é o que um formulário mostra ao lado do input. Uma password fraca
          **não** queima o convite.
      summary: Activar um convite
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtivacaoInRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroOut'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroOut'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login
      description: |-
        `POST /api/v1/auth/login` — email e password, devolve a sessão.

        `AllowAny` e não o `IsAuthenticated` do default: é o endpoint por onde se
        passa a estar autenticado.

        Quem está autenticado e volta a fazer login é servido normalmente, e o
        `login()` do Django faz `flush()` à sessão anterior se for outra conta — o
        que fecha o caminho em que uma sessão de A ficava com o `tenant_id` de A e o
        utilizador B.
      summary: Iniciar sessão
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroOut'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroOut'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      description: |-
        `POST /api/v1/auth/logout` — fecha a sessão e devolve o estado `anonimo`.

        `IsAuthenticated`: só se termina uma sessão que existe. Um anónimo leva o
        403 do DRF, que é correcto e não precisa de código próprio — repetir o
        logout é um bug do cliente, não um caso de uso.

        `POST` e não `GET`, apesar de não levar corpo: um `GET` que fecha a sessão é
        disparável por um `<img>` numa página qualquer, e a protecção de CSRF não se
        aplica a métodos seguros.
      summary: Terminar sessão
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoOut'
          description: ''
  /api/v1/auth/preferencias:
    patch:
      operationId: auth_preferencias
      description: |-
        `PATCH /api/v1/auth/preferencias` — as definições desta pessoa (ADR 0016).

        Hoje tem um campo, o `tema`, e é `PATCH` e não `PUT` porque é uma alteração
        parcial de uma entidade que vai ganhar campos: um `PUT` com um campo obriga
        o cliente a reenviar tudo no dia em que houver três, e um cliente antigo
        apagava o que não conhecesse.

        Devolve `SessaoOut` e não uma forma própria, pelo argumento da ADR 0010: o
        cliente guarda **uma** entrada de cache e qualquer destas respostas a
        substitui, em vez de uma quinta forma e um quinto ramo de Zod.

        ## Dispensada de âmbito, e porque é que isso aqui não dispensa de CSRF

        Escreve numa tabela sem política (`accounts_user`, ADR 0007) e tem de
        funcionar em `escolha_pendente` e em `sem_estabelecimento`: um tema que só se
        possa trocar depois de escolher o estabelecimento é um tema que não se troca
        no ecrã onde o relâmpago da primeira pintura se vê.

        **Não leva `csrf_protect`, e a ausência é deliberada** — é a diferença exacta
        que o `SECURITY.md` §5 descreve e que o `LoginView` e a `AtivacaoView`
        documentam do outro lado. O `as_view()` do DRF embrulha tudo em
        `csrf_exempt`, e o que repõe a verificação é o `SessionAuthentication`:
        **quando encontra utilizador na sessão**, ele verifica o token. O furo da ADR
        0010 era dos endpoints **anónimos** de escrita, que é o que o login e a
        activação são e este não é — com `IsAuthenticated`, não há caminho até aqui
        sem sessão. Fica escrito para ninguém o "corrigir" nos dois sentidos.

        ## Não há `user_id` no corpo

        A escrita é sempre sobre o `request.user` (`PreferenciasInSerializer`). Não
        é uma verificação que esta view faz: é um argumento que não existe, logo não
        há objecto para autorizar nem caminho para a preferência de outra pessoa. É
        a razão pela qual não há `has_object_permission` nem `pk` nesta rota, e a
        prova está no `tests/test_preferencias.py`.

        Qualquer papel, e sem `PertenceAoTenant`: o tema é de quem o pede e não do
        estabelecimento (ADR 0016), e exigir pertença fechava o ecrã a quem ainda
        não escolheu estabelecimento — que é metade do problema que esta ADR resolve.
      summary: Guardar as preferências desta pessoa
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenciasInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoOut'
          description: ''
  /api/v1/auth/sessao:
    get:
      operationId: auth_sessao
      description: |-
        `GET /api/v1/auth/sessao` — quem está autenticado, onde, e onde mais pode.

        `AllowAny` e 200 com `estado = anonimo` para um pedido sem sessão: o
        arranque da SPA tem de poder perguntar "há sessão?" sem ter sessão. Com
        `IsAuthenticated`, a pergunta respondia 403 e o cliente passava a distinguir
        dois 403 diferentes no seu caminho mais crítico.

        `ensure_csrf_cookie` é o que dispensa um endpoint de CSRF próprio (ADR
        0010): a SPA chama isto no arranque, o cookie `csrftoken` vem na resposta, e
        o `POST /auth/login` já tem com que o assinar. Note-se que o `login()` do
        Django **roda** o token (`rotate_token`), pelo que o cookie muda na resposta
        do login — o cliente lê-o do cookie a cada pedido e não o guarda, logo isso
        é transparente para ele.
      summary: Estado da sessão
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoOut'
          description: ''
  /api/v1/auth/tenant-ativo:
    post:
      operationId: auth_tenant_ativo
      description: |-
        `POST /api/v1/auth/tenant-ativo` — escolhe o estabelecimento da sessão.

        O `tenant_id` do corpo é **argumento e não credencial**: quem o verifica é a
        política, dentro do `tenant_scope` que o service abre, contra a pertença de
        quem pede. Esta view não o compara com nada — se comparasse, haveria duas
        verificações e uma delas acabaria por ser a única.
      summary: Escolher o estabelecimento ativo
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantAtivoInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoOut'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroOut'
          description: ''
  /api/v1/convites:
    get:
      operationId: convites_listar
      description: 'Os convites do estabelecimento ativo, mais recentes primeiro,
        paginados. O `estado` é derivado e diz que acções fazem sentido: `reenviar`
        num `pendente` ou `expirado`, `revogar` em tudo o que não foi aceite. **Nunca**
        inclui o token — ele sai uma vez, na resposta do POST que criou o convite.'
      summary: Convites do estabelecimento ativo
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - convites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConviteOutList'
          description: ''
    post:
      operationId: convites_criar
      description: O token sai **aqui**, uma vez, e nunca mais (ADR 0010).
      summary: Convidar alguém para o estabelecimento
      tags:
      - convites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConviteInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConviteCriadoOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroOut'
          description: ''
  /api/v1/convites/{id}/reenviar:
    post:
      operationId: convites_reenviar
      description: 'Roda o token: o link anterior deixa de casar com alguma coisa.'
      summary: Reenviar um convite, com um token novo
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this convite.
        required: true
      tags:
      - convites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConviteCriadoOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroOut'
          description: ''
  /api/v1/convites/{id}/revogar:
    post:
      operationId: convites_revogar
      description: 'Sem corpo na resposta além do convite: não há token novo a mostrar.'
      summary: Revogar um convite
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this convite.
        required: true
      tags:
      - convites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConviteOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroOut'
          description: ''
  /api/v1/documents:
    get:
      operationId: documentos_listar
      description: Os documentos com pelo menos uma página, mais recentes primeiro,
        paginados. **Um slot sem páginas nunca aparece aqui** e um documento descartado
        também não — para esses há o `GET` por `id`, que é o alvo do polling enquanto
        a fotografia não chega.
      summary: Documentos de fornecedor do estabelecimento ativo
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentoOutList'
          description: ''
    post:
      operationId: documentos_criar
      description: 'Com `ficheiro`, é o upload de um só gesto: o documento nasce **fechado**
        e o trabalho fica agendado. Sem `ficheiro`, é o slot que o QR nomeia: nasce
        aberto, espera 15 minutos pela primeira página e é fechado por uma pessoa.'
      summary: Abrir um documento — com ficheiro, ou vazio para captura
      tags:
      - documents
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentoInRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecusaDeDocumentoOut'
          description: ''
  /api/v1/documents/{id}:
    get:
      operationId: documentos_ler
      description: 'O alvo do polling do bloco do QR (2 s enquanto o bloco está aberto,
        com desistência aos 3 minutos). Serve **também** um slot ainda sem páginas
        e um documento descartado: é precisamente esse o estado que o desktop está
        a sondar.'
      summary: Um documento, com páginas e o que o modelo leu
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this documento de fornecedor.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoOut'
          description: ''
    delete:
      operationId: documentos_descartar
      description: 'Descarte **suave**: a linha fica com `discarded_at` e sai da lista.
        Os bytes só são apagados se o documento não tiver páginas — o original de
        um documento fiscal não se apaga enquanto não houver política de retenção.'
      summary: Descartar um documento
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this documento de fornecedor.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/documents/{id}/closing:
    post:
      operationId: documentos_fechar
      description: 'Repetível dentro do mesmo estado: fechar duas vezes devolve 200
        e não agenda trabalho duas vezes. Um documento sem páginas não se fecha —
        morre pelo relógio.'
      summary: 'Fechar o documento: não vêm mais páginas'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this documento de fornecedor.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecusaDeDocumentoOut'
          description: ''
  /api/v1/documents/{id}/files:
    post:
      operationId: documentos_anexar_ficheiro
      description: 'Um ficheiro por pedido. **201 na primeira vez e 200 na repetição**:
        os mesmos bytes no mesmo documento não criam uma segunda página, e o código
        de status é o que torna essa idempotência observável — uma retentativa numa
        rede má não deve parecer um erro.'
      summary: Anexar um ficheiro (uma fotografia, ou um PDF)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this documento de fornecedor.
        required: true
      tags:
      - documents
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FicheiroDeDocumentoInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoOut'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoOut'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecusaDeDocumentoOut'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecusaDeDocumentoOut'
          description: ''
  /api/v1/documents/{id}/pages/{posicao}/image:
    get:
      operationId: documentos_imagem_da_pagina
      description: 'Servida por esta view e nunca pelo proxy: o `MEDIA_URL` não tem
        valor e o `/media/` não é encaminhado (ADR 0020, decisão 4). `inline`, `nosniff`,
        `Cache-Control: private`. 404 enquanto a página não estiver normalizada —
        e hoje nenhuma está, porque não há rasterizador nas dependências deste projecto.'
      summary: A imagem normalizada de uma página
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this documento de fornecedor.
        required: true
      - in: path
        name: posicao
        schema:
          type: integer
        description: A ordem da página dentro do documento, a começar em 1.
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            image/webp:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/estabelecimento:
    get:
      operationId: estabelecimento_ler
      description: |-
        `GET`/`PATCH /api/v1/estabelecimento` — a configuração da empresa (ADR 0017).

        ## Com âmbito, e é o default que o diz

        Não leva `@tenant_scope_exempt` e é essa ausência que a torna normal: lê e
        escreve o `accounts_tenant`, que **tem** política (a única cuja política
        compara `id` em vez de `tenant_id`, porque a tabela *é* o tenant). Dentro do
        âmbito a tabela tem no máximo uma linha visível, que é a razão de o service
        fazer `Tenant.objects.get()` sem filtro.

        ## Sem `has_object_permission`, porque não há objecto endereçável

        O `SECURITY.md` §5 exige `obj.tenant_id == request.tenant.id` em toda a view
        que receba um `pk` — esta não recebe nenhum, nem no path nem no corpo. Qual é
        o estabelecimento decide-se no âmbito que o middleware abriu a partir da
        sessão, logo não existe id de outro tenant para rejeitar. O `PertenceAoTenant`
        continua na lista pelo seu `has_permission`, que nega quando não há
        `request.tenant`.

        ## `owner` em leitura **e** em escrita, e o 403 é a rede e não o controlo

        A ADR 0011 escolheu `owner` para editar; a ADR 0017 estende-o à leitura com o
        argumento da ADR 0013 — *o default é o mais fechado, e um conjunto de um
        elemento alarga-se sem se desfazer* — e porque nada fora deste ecrã precisa
        destas leituras por HTTP.

        **403 e não 200 com blocos ausentes**, com a forma exacta do DRF (`detail`,
        **sem `code` novo**): num ecrã de configurações, um 200 parcial torna "não
        podes ver isto" indistinguível de "esta empresa ainda não configurou nada", e
        os dois precisam de ecrãs opostos — o vazio ensina a configurar, o restrito
        não pode. O cliente já sabe o papel antes de pedir (vem na sessão), logo não
        monta o ecrã e não dispara o pedido; o 403 é a rede do deep link e da pertença
        revogada a meio da sessão.

        ## `csrf_protect` **está** aqui, ao contrário do `/auth/preferencias`

        Os dois são autenticados, logo o `SessionAuthentication` verifica o token nos
        dois e a linha é, hoje, redundante. Fica porque esta view tem uma diferença
        que a outra não tem: **escreve configuração de uma empresa inteira**, e o
        `as_view()` do DRF embrulha tudo em `csrf_exempt` — a protecção depende de o
        `SessionAuthentication` correr e **encontrar** utilizador. No dia em que
        alguém acrescentar aqui uma autenticação por token (que não verifica CSRF), a
        diferença entre as duas views é esta linha. A redundância é barata; descobrir
        que não havia nenhuma não é.

        ## 400 por campo, e um deles é uma regra de negócio

        A hora fora da janela 00:00–06:00 e um regime fora dos dois valores saem como
        400 no campo (`EstabelecimentoInSerializer`). O terceiro 400 vem do service e
        é do `nome`: no estabelecimento de demonstração o nome não se altera (ADR
        0018) — e essa é a única recusa desta família que não é sobre a forma.
      summary: A configuração deste estabelecimento
      tags:
      - estabelecimento
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstabelecimentoOut'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroOut'
          description: ''
    patch:
      operationId: estabelecimento_guardar
      description: |-
        `GET`/`PATCH /api/v1/estabelecimento` — a configuração da empresa (ADR 0017).

        ## Com âmbito, e é o default que o diz

        Não leva `@tenant_scope_exempt` e é essa ausência que a torna normal: lê e
        escreve o `accounts_tenant`, que **tem** política (a única cuja política
        compara `id` em vez de `tenant_id`, porque a tabela *é* o tenant). Dentro do
        âmbito a tabela tem no máximo uma linha visível, que é a razão de o service
        fazer `Tenant.objects.get()` sem filtro.

        ## Sem `has_object_permission`, porque não há objecto endereçável

        O `SECURITY.md` §5 exige `obj.tenant_id == request.tenant.id` em toda a view
        que receba um `pk` — esta não recebe nenhum, nem no path nem no corpo. Qual é
        o estabelecimento decide-se no âmbito que o middleware abriu a partir da
        sessão, logo não existe id de outro tenant para rejeitar. O `PertenceAoTenant`
        continua na lista pelo seu `has_permission`, que nega quando não há
        `request.tenant`.

        ## `owner` em leitura **e** em escrita, e o 403 é a rede e não o controlo

        A ADR 0011 escolheu `owner` para editar; a ADR 0017 estende-o à leitura com o
        argumento da ADR 0013 — *o default é o mais fechado, e um conjunto de um
        elemento alarga-se sem se desfazer* — e porque nada fora deste ecrã precisa
        destas leituras por HTTP.

        **403 e não 200 com blocos ausentes**, com a forma exacta do DRF (`detail`,
        **sem `code` novo**): num ecrã de configurações, um 200 parcial torna "não
        podes ver isto" indistinguível de "esta empresa ainda não configurou nada", e
        os dois precisam de ecrãs opostos — o vazio ensina a configurar, o restrito
        não pode. O cliente já sabe o papel antes de pedir (vem na sessão), logo não
        monta o ecrã e não dispara o pedido; o 403 é a rede do deep link e da pertença
        revogada a meio da sessão.

        ## `csrf_protect` **está** aqui, ao contrário do `/auth/preferencias`

        Os dois são autenticados, logo o `SessionAuthentication` verifica o token nos
        dois e a linha é, hoje, redundante. Fica porque esta view tem uma diferença
        que a outra não tem: **escreve configuração de uma empresa inteira**, e o
        `as_view()` do DRF embrulha tudo em `csrf_exempt` — a protecção depende de o
        `SessionAuthentication` correr e **encontrar** utilizador. No dia em que
        alguém acrescentar aqui uma autenticação por token (que não verifica CSRF), a
        diferença entre as duas views é esta linha. A redundância é barata; descobrir
        que não havia nenhuma não é.

        ## 400 por campo, e um deles é uma regra de negócio

        A hora fora da janela 00:00–06:00 e um regime fora dos dois valores saem como
        400 no campo (`EstabelecimentoInSerializer`). O terceiro 400 vem do service e
        é do `nome`: no estabelecimento de demonstração o nome não se altera (ADR
        0018) — e essa é a única recusa desta família que não é sobre a forma.
      summary: Guardar a configuração deste estabelecimento
      tags:
      - estabelecimento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstabelecimentoInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstabelecimentoOut'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroOut'
          description: ''
  /api/v1/menu:
    put:
      operationId: menu_guardar
      description: |-
        Substitui **toda** a configuração de menu do estabelecimento ativo: o corpo é a lista inteira, porque reordenar é uma intenção só. Uma rota ausente do corpo volta ao default, e `[]` repõe todos os defaults. Cada `route_id` aparece no máximo uma vez.

        A resposta é a configuração **como ficou**, sem filtro de papel — um cliente que a volte a enviar não perde nada. O menu filtrado pelo papel de quem pede viaja no `GET /api/v1/auth/sessao`. Só o `owner`.
      summary: Substituir a configuração do menu do estabelecimento
      tags:
      - menu
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ItemDeMenuInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemDeMenuOut'
          description: ''
  /api/v1/menu/rotas:
    get:
      operationId: menu_rotas
      description: 'A lista fechada de rotas que o menu pode nomear, com o rótulo
        e o grupo por omissão, os papéis que as podem ver e se foram desenhadas para
        telemóvel. É um registo em **código**: nenhuma linha de base de dados é lida,
        e a ordem é a do menu por omissão. Só o `owner`.'
      summary: As rotas que existem, com os seus defaults
      tags:
      - menu
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RotaDeMenuOut'
          description: ''
components:
  schemas:
    AtivacaoInRequest:
      type: object
      description: |-
        O corpo do `POST /auth/ativar`: o fragmento do link e, talvez, a password.

        ## Um campo opaco, e o cliente não o divide

        O `fragmento` é o que vem depois do `#` no link — `<uuid-do-tenant>.<token>`
        — e viaja inteiro. A SPA lê-o do `location.hash` e põe-no no corpo sem o
        interpretar: quem o divide é o service, logo o formato do segredo tem **uma**
        definição e ela vive no servidor. Um contrato com `tenant_id` e `token`
        separados obrigava o cliente a conhecer o formato, e o dia em que ele mudasse
        eram dois sítios a mudar.

        O fragmento não chega ao servidor por acidente nenhum: não entra no log de
        acesso do proxy, não viaja em `Referer`, e um pre-fetch do cliente de email
        não consegue queimar um token de uso único (ADR 0010). É o POST que o traz.

        ## A password é opcional **porque o servidor é que sabe** se é precisa

        `required=False` e não `required=True`: uma conta que já tem password
        utilizável **não** a redefine ao aceitar um convite (ADR 0010) — a password é
        global e a pertença é por tenant, pelo que "convite + definir password" dava
        a quem pode convidar a tomada de uma conta existente, com os outros
        estabelecimentos dela lá dentro. Nesse caso a activação exige sessão e este
        campo é ignorado.

        `required=False` e **não** `default=""`, e a diferença é toda no cliente
        gerado: um campo com `default` chega ao `types.ts` como `password: string`
        (obrigatório, com um valor por omissão), e um campo sem ele chega como
        `password?: string`, que é a verdade — a activação de quem já tem conta não
        manda password nenhuma. O preço é um `.get("password", "")` na view, que é
        uma palavra.

        Quem decide é o service, depois de casar o convite, porque só aí se sabe que
        email está em jogo. A força da password também é validada lá, pelos
        `AUTH_PASSWORD_VALIDATORS` — e não aqui, porque o
        `UserAttributeSimilarityValidator` precisa do email do convite, que este
        serializer não pode ver sem ser o oráculo que a ADR fecha.

        `trim_whitespace=False` na password, como no login: um espaço final é um
        carácter da password de quem o escreveu.
      properties:
        fragmento:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          maxLength: 128
      required:
      - fragmento
    ConviteCriadoOut:
      type: object
      description: |-
        A resposta de `criar` e de `reenviar`: o convite **e** o segredo, uma vez.

        Duas peças e não uma, porque têm tempos de vida diferentes: o `convite` é o
        que a listagem volta a mostrar sempre, e o `fragmento` é a única vez que
        este valor existe fora da cabeça do servidor. A separação diz isso ao
        cliente sem um comentário.

        O `fragmento` é `<uuid-do-tenant>.<token>` e é o que vai **depois do `#`**:
        o link é `${origin}/ativar#${fragmento}`. Quem o compõe é o frontend, porque
        é quem conhece a sua origem — o backend devolver um URL absoluto obrigava-o
        a conhecer o domínio da SPA, que é configuração que ele não tem e que em dev,
        em CI e em produção é diferente.

        E é o fragmento e não o path, por três razões que a ADR 0010 fixa: o
        fragmento não chega ao servidor, logo não entra no log de acesso do proxy;
        não viaja em `Referer`; e um pre-fetch do cliente de email não queima um
        token de uso único.
      properties:
        convite:
          $ref: '#/components/schemas/ConviteOut'
        fragmento:
          type: string
          maxLength: 80
      required:
      - convite
      - fragmento
    ConviteInRequest:
      type: object
      description: |-
        O corpo do `POST /convites`: quem, com que papel, e com que nome.

        Os três campos são os que o `Membership` precisa no dia em que nascer, e
        nenhum deles é o token: quem gera o token é o service, com `secrets`, e um
        token que viesse do cliente era um token escolhido pelo cliente.

        O `nome` é o `display_name` **neste** estabelecimento — a mesma pessoa é
        "Ana Silva (contabilidade)" num e "Ana" noutro —, e quem o sabe é quem
        convida. Por isso viaja aqui e não no corpo da activação: quem aceita não
        escolhe como aparece na lista de membros de quem o convidou.

        Não há validação de duplicados aqui, e é deliberado: "já existe um convite
        pendente para este email" e "esta pessoa já é membro" são leituras à base de
        dados dentro do âmbito do pedido, logo pertencem ao service, que é quem tem
        a transação e quem as escreve. Validá-las aqui dava duas verificações, e a
        de cá nunca é a que a corrida perde.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        papel:
          $ref: '#/components/schemas/PapelEnum'
        nome:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - email
      - nome
      - papel
    ConviteOut:
      type: object
      description: |-
        Um convite como a listagem o mostra. **Sem token, e sem forma de o ter.**

        O token sai **uma vez**, na resposta do POST que o criou, como uma chave de
        API (ADR 0010): um token mostrável depois teria de ser guardado em claro, e
        o que esta tabela guarda é só o SHA-256. Esta classe é o sítio onde isso se
        vê — a lista de campos é explícita e o `token_hash` não está nela. Não é um
        `ModelSerializer`, logo nem um campo novo no modelo nem um `fields =
        "__all__"` distraído o podem pôr aqui.

        O `estado` é derivado dos três timestamps (ver `EstadoDoConvite`) e sai como
        enum fechado no OpenAPI, pelo que a união chega ao `types.ts` e o `switch`
        do frontend não pode esquecer um ramo. É o que o ecrã precisa para decidir
        que botão mostrar: `reenviar` num pendente ou expirado, `revogar` em tudo o
        que não foi aceite.

        O `expira_em` vai como data e não como "faltam 3 dias": o cliente formata o
        que quiser, e um número de dias calculado no servidor fica errado no ecrã de
        quem o deixou aberto.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        papel:
          $ref: '#/components/schemas/PapelEnum'
        nome:
          type: string
          maxLength: 150
        estado:
          $ref: '#/components/schemas/ConviteOutEstadoEnum'
        expira_em:
          type: string
          format: date-time
        criado_em:
          type: string
          format: date-time
      required:
      - criado_em
      - email
      - estado
      - expira_em
      - id
      - nome
      - papel
    ConviteOutEstadoEnum:
      enum:
      - pendente
      - expirado
      - aceite
      - revogado
      type: string
      description: |-
        * `pendente` - à espera de activação
        * `expirado` - expirou sem ser usado
        * `aceite` - aceite, com pertença criada
        * `revogado` - revogado por quem convidou
    DocumentoInRequest:
      type: object
      description: |-
        O corpo do `POST /documents`: um ficheiro, ou nada.

        **Nada** é o slot que o QR nomeia (ADR 0020, decisão 2): o desktop cria o
        documento vazio, o telemóvel anexa-lhe páginas. **Um ficheiro** é o upload de
        um só gesto, que é o que o dono pediu para o desktop.

        `source` não está aqui de propósito: a origem é derivada de vir ou não
        ficheiro (ver `services.criar_documento`), e um campo que o cliente
        declarasse era mais uma coisa que ele pode pôr errada.
      properties:
        ficheiro:
          type: string
          format: binary
    DocumentoOut:
      type: object
      description: |-
        O `DocumentoOut` da decisão 9 da ADR 0021, campo a campo.

        É a resposta das **cinco** operações que devolvem um documento — criar,
        anexar, fechar, ler um, listar —, e é deliberado: um cliente que faz uma
        escrita recebe o estado completo e não precisa de uma segunda leitura para o
        descobrir (é também o que faz o polling da ADR 0020 poder ser só um `GET`).

        Três campos que merecem nota:

        * `state` é **derivado** e nunca guardado. Ver `models.estado_do_documento`;
        * `expires_at` é `created_at + 15 min`, sempre — também num documento que já
          tem páginas, onde não quer dizer nada. É o que o bloco do QR do desktop usa
          para contar o tempo, e servi-lo nulo depois da primeira página obrigava o
          cliente a guardar o valor anterior;
        * `receipt` é **sempre nulo nesta fatia**. O campo está no contrato desde já
          para o `types.ts` não mudar de forma na fatia 2, que é quando o
          `purchasing_receipt` nasce; hoje não há tabela nenhuma que o possa
          preencher. É a única mentira possível deste payload, e por isso está dita
          aqui.
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/OrigemDoDocumentoEnum'
        state:
          $ref: '#/components/schemas/EstadoDoDocumentoEnum'
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          maxLength: 150
        closed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        page_count:
          type: integer
        page_limit:
          type: integer
        files:
          type: array
          items:
            $ref: '#/components/schemas/FicheiroOut'
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PaginaOut'
        extraction:
          allOf:
          - $ref: '#/components/schemas/ExtracaoOut'
          nullable: true
        receipt:
          type: string
          format: uuid
          nullable: true
      required:
      - closed_at
      - created_at
      - created_by
      - expires_at
      - extraction
      - files
      - id
      - page_count
      - page_limit
      - pages
      - receipt
      - source
      - state
    ErroOut:
      type: object
      description: |-
        O corpo de uma recusa: `code` estável para ramificar, `detail` para ler.

        É a mesma forma que o `TenantMiddleware` já devolve (`sem_sessao`,
        `tenant_desconhecido`, `tenant_divergente`), e está aqui para entrar no
        `schema.yml`: sem isto, o cliente gerado conhecia as respostas de sucesso e
        tratava as recusas como `unknown`, que é precisamente onde o frontend tem de
        ramificar.

        O `code` é uma string e não um enum fechado de propósito: o conjunto de
        códigos é **por endpoint** (`credenciais_invalidas` só no login,
        `conta_bloqueada` só no 429) e um enum único com a união de todos sugeria ao
        frontend ramos que aquele endpoint nunca devolve. Os códigos de cada resposta
        estão nos docstrings do `views.py`.
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    EstabelecimentoInRequest:
      type: object
      description: |-
        O corpo do `PATCH /estabelecimento`: os três campos configuráveis.

        **Não há `demonstracao` e não há `id`.** O primeiro é só de leitura (a razão
        está no modelo: marcar um estabelecimento real como demonstração era esconder
        dados reais atrás de um aviso de "isto é de brincar"); o segundo não existe
        porque qual é o estabelecimento decide-se no âmbito e não no corpo — é a
        mesma forma com que o `PreferenciasInSerializer` não tem `user_id`. Não é uma
        verificação que a view faz: é um argumento que não existe.

        ## `PATCH` com os três campos obrigatórios, e é coerente e não contraditório

        Hoje o corpo tem de os trazer todos, logo isto comporta-se como um `PUT`. O
        método é `PATCH` pelo que acontece **depois**: um quarto campo entra como
        `required=False` e nenhum cliente antigo tem de ser alterado, enquanto com
        `PUT` a semântica obrigava-o a reenviar tudo e um cliente que não conhecesse
        o campo novo apagava-o. É a mesma escolha do `/auth/preferencias`, e é
        compatível com o `COMPONENT_SPLIT_PATCH = False` das settings — nenhuma view
        desta casa valida com `partial=True`, pelo que o `types.ts` gerado diz que os
        três são obrigatórios, que é a verdade.

        ## A janela do dia de negócio é validada aqui **e** na base de dados

        O `TimeField` recusa `"25:00"` por forma, e o `validate_business_day_starts_at`
        recusa `"16:00"` por domínio — com a frase que aparece debaixo do campo. A
        `CheckConstraint` da migração 0009 é a **rede**: um dia de negócio às 16:00
        parte todos os dias em dois em silêncio, e a linha não deve conseguir existir
        venha de onde vier. É a mesma relação que o menu tem com a sua unicidade.
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 200
        vat_regime:
          $ref: '#/components/schemas/VatRegimeEnum'
        business_day_starts_at:
          type: string
          format: time
      required:
      - business_day_starts_at
      - nome
      - vat_regime
    EstabelecimentoOut:
      type: object
      description: |-
        A resposta do `GET` e do `PATCH /estabelecimento` (ADR 0017).

        **Não é o `TenantOutSerializer`**, e a diferença é a razão de existirem os
        dois: aquele descreve o estabelecimento como o **seletor** o mostra — id,
        nome e o papel de quem está a ver — e viaja em cada resposta de sessão. Este
        descreve a **entidade**: o que ela é e como está configurada, sem papel
        nenhum, porque a configuração não muda com quem olha. Juntá-los punha o
        regime de IVA em cada `GET /auth/sessao` de cada colaborador.

        `business_day_starts_at` sai como `"04:00"` e não `"04:00:00"`: o `format`
        está explícito porque o default do DRF é `"%H:%M:%S"`, e o que o contrato da
        ADR 0017 fixa — e o que um `<input type="time">` consome — são horas e
        minutos. Os segundos seriam três caracteres que nunca são outra coisa que
        `00`.
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        vat_regime:
          $ref: '#/components/schemas/VatRegimeEnum'
        business_day_starts_at:
          type: string
          format: time
        demonstracao:
          type: boolean
      required:
      - business_day_starts_at
      - demonstracao
      - id
      - nome
      - vat_regime
    EstadoDaLeituraEnum:
      enum:
      - pendente
      - lido
      - ilegivel
      - erro
      type: string
      description: |-
        * `pendente` - a chamada começou e não acabou
        * `lido` - o modelo respondeu e a resposta valida
        * `ilegivel` - o modelo respondeu e a resposta não valida
        * `erro` - a chamada falhou
    EstadoDoDocumentoEnum:
      enum:
      - aguarda_captura
      - expirado
      - a_normalizar
      - a_extrair
      - lido
      - ilegivel
      - erro
      - descartado
      type: string
      description: |-
        * `aguarda_captura` - slot aberto, à espera da primeira página
        * `expirado` - o slot expirou sem página nenhuma
        * `a_normalizar` - há páginas e a imagem ainda não está pronta
        * `a_extrair` - o modelo está a ler o documento
        * `lido` - o modelo leu e o resultado está disponível
        * `ilegivel` - o modelo respondeu algo que não se consegue validar
        * `erro` - a extração falhou ou nunca acabou
        * `descartado` - descartado por uma pessoa
    ExtracaoOut:
      type: object
      description: |-
        O que o modelo leu, num painel **só de leitura**.

        É a entrega da fatia 1 ao dono: *"arrastar um PDF no desktop, ver as páginas,
        e ver o que o modelo leu"*. Nada disto é a verdade do estabelecimento — a
        verdade é o que uma pessoa confirmar na revisão, que é a fatia 2 — e por isso
        o cabeçalho e as linhas vêm **vazios** quando o estado não é `lido`.

        `reason` é a razão legível de um `erro`, e existe porque hoje o erro é sempre
        o mesmo e tem uma explicação curta: não há modelo configurado. Um estado
        `erro` sem frase mandava alguém ler logs do worker. **Não está no
        `ExtracaoOut` da ADR** — é um campo aditivo, e o nome vai em inglês como os
        vizinhos (decisão 9), apesar de o campo do DTO interno se chamar `motivo`
        como o resto do Python deste repositório.
      properties:
        state:
          $ref: '#/components/schemas/EstadoDaLeituraEnum'
        confidence:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,3})?$
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
        supplier_name:
          type: string
          maxLength: 200
        supplier_nif:
          type: string
          maxLength: 20
        doc_type:
          type: string
          maxLength: 20
        doc_number:
          type: string
          maxLength: 100
        issued_at:
          type: string
          format: date
          nullable: true
        customer_nif:
          type: string
          maxLength: 20
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LinhaLidaOut'
      required:
      - confidence
      - customer_nif
      - doc_number
      - doc_type
      - issued_at
      - lines
      - read_at
      - reason
      - state
      - supplier_name
      - supplier_nif
      - total
    FicheiroDeDocumentoInRequest:
      type: object
      description: |-
        O corpo do `POST /documents/<id>/files`: **um** ficheiro, obrigatório.

        Um e não uma lista: *"um ficheiro é um documento, com N páginas, e nunca é
        partido automaticamente"* (ADR 0020, decisão 5), e duas fotografias são dois
        pedidos — o que é também o que faz uma retentativa de rede má poder ser
        idempotente por `sha256`, que uma lista parcialmente aceite não poderia.
      properties:
        ficheiro:
          type: string
          format: binary
      required:
      - ficheiro
    FicheiroOut:
      type: object
      description: |-
        Um ficheiro: o que entrou, quando, e o que os bytes diziam.

        `content_type` é o **real** (bytes mágicos) e não o que o cliente declarou —
        é a única forma deste campo, e é também o que o torna útil num relatório de
        suporte. `received_at` é o `created_at` da linha: a mesma coisa com o nome que
        o contrato lhe dá.

        Não sai o `path`: é um caminho no armazenamento do servidor, não tem valor
        nenhum para o cliente, e um payload que o traga é um payload que ensina a
        estrutura do disco a quem o ler.
      properties:
        position:
          type: integer
        original_filename:
          type: string
          maxLength: 255
        content_type:
          type: string
          maxLength: 100
        byte_size:
          type: integer
        pages_detected:
          type: integer
        received_at:
          type: string
          format: date-time
      required:
      - byte_size
      - content_type
      - original_filename
      - pages_detected
      - position
      - received_at
    ItemDeMenuInRequest:
      type: object
      description: |-
        Uma linha do corpo do `PUT /menu`: o que o tenant decidiu sobre uma rota.

        Os quatro campos configuráveis, e nada mais. **Não** há `campo`, e isso é
        estrutural e não uma omissão: se a forma que a configuração transporta
        tivesse esse campo, uma empresa conseguia promover uma rota de escritório
        para o telemóvel escrevendo `campo: true` — e o predicado que diz "este ecrã
        foi desenhado para 360px" é código (ADR 0009, adenda 2). Também não há
        `caminho` nem `icone`: a árvore de rotas é código, e um menu que nomeasse
        caminhos punha o deep link a depender da configuração.

        O `route_id` é um `ChoiceField` sobre o enum fechado do backend, e é essa
        linha que impede a tabela de ser um armazém chave/valor: um id inventado é
        400 por campo, não uma linha guardada que ninguém sabe ler.

        `rotulo` é opcional e pode vir `null`; os outros três são obrigatórios,
        porque o corpo é a configuração **inteira** e não um `PATCH` — "mantém o que
        estava" não é uma intenção que este endpoint consiga ter.

        `allow_blank=False` no `rotulo`: um rótulo vazio não é um rótulo. Quem quer
        o default manda `null` ou omite-o, e a coluna guarda `""` para essa ausência
        (ver o modelo) — um sítio só a traduzir as duas formas.
      properties:
        route_id:
          $ref: '#/components/schemas/RotaIdEnum'
        grupo:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
        ordem:
          type: integer
          maximum: 32767
          minimum: 0
        visivel:
          type: boolean
        rotulo:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
      required:
      - ordem
      - route_id
      - visivel
    ItemDeMenuOut:
      type: object
      description: |-
        Um item do menu **já resolvido**: o registo com a configuração por cima.

        A tupla da ADR 0009 — `(route_id, grupo, ordem, visivel, rotulo)` —, uma
        lista com um nível de agrupamento e nunca uma árvore ("esconder e reordenar
        uma árvore é um problema muito maior e 'cresce' não precisa dele").

        Serve as **duas** posições onde o menu aparece: o `menu` do `SessaoOut`
        (filtrado pelo papel de quem pede) e a resposta do `PUT /menu` (a
        configuração inteira, como ficou). Uma classe e não duas porque a forma é a
        mesma e duas idênticas davam dois componentes iguais no OpenAPI, logo dois
        esquemas de Zod a divergir. A diferença entre as duas posições é **o
        conjunto de linhas**, não a forma de cada uma, e está escrita no
        `selectors.projeccao_de_menu`.

        `visivel` vem com o seu valor e não filtrado: esconder é apresentação e a
        rota continua a funcionar por deep link (ADR 0009) — quem esconde é o
        cliente, e o painel precisa de ver o que está escondido para o poder mostrar
        outra vez. Filtrar aqui transformava "esconder" num controlo de acesso
        falso e um marcador guardado num 404.

        `rotulo` é `null` quando o tenant não sobrepôs nada, e **não** o rótulo do
        registo já resolvido: o cliente faz `rotulo ?? registo.rotulo`, que é o que
        o `montarMenu` do shell já escreve. O porquê está no `menu.ItemDeMenu` — em
        resumo, resolvê-lo aqui prendia o tenant a um default que ele nunca escolheu.

        **Não** leva `campo`: o que esta lista transporta é configuração, e o
        predicado de rota de campo é código (ADR 0009, adenda 2). Quem o quer pede
        `GET /menu/rotas`, que é o registo.
      properties:
        route_id:
          $ref: '#/components/schemas/RotaIdEnum'
        grupo:
          type: string
          nullable: true
          maxLength: 50
        ordem:
          type: integer
        visivel:
          type: boolean
        rotulo:
          type: string
          nullable: true
          maxLength: 50
      required:
      - grupo
      - ordem
      - rotulo
      - route_id
      - visivel
    LinhaLidaOut:
      type: object
      description: |-
        Uma linha **como o modelo a leu**. Texto não confiável, já validado.

        Chega aqui depois de o `agents` a ter validado contra o seu schema à escrita
        **e** à leitura (ADR 0021, decisão 4: *"é a única coluna do sistema em que
        nada se confia"*). O que este serializer acrescenta é a terceira passagem, a
        da forma do contrato: os `max_length` e os `decimal_places` são os que o
        `types.ts` vai prometer ao frontend.

        Os números são `Decimal` com `coerce_to_string` implícito (o default do DRF):
        saem como string no JSON, que é a única forma de um preço não passar por um
        `float` do JavaScript.
      properties:
        position:
          type: integer
        description:
          type: string
          maxLength: 500
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          nullable: true
        unit:
          type: string
          maxLength: 20
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          nullable: true
        vat_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          nullable: true
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        confidence:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,3})?$
          nullable: true
      required:
      - confidence
      - description
      - line_total
      - position
      - quantity
      - unit
      - unit_price
      - vat_rate
    LoginInRequest:
      type: object
      description: |-
        O corpo do `POST /auth/login`: um email e uma password, e nada mais.

        O `max_length` do email é o do `EmailField` do modelo (254, o limite do
        RFC 5321) e o da password é um teto de sanidade, não uma regra de força: a
        força é dos `AUTH_PASSWORD_VALIDATORS`, e **não** se valida aqui. Validar a
        força no login seria dizer a quem tenta entrar que a password que escreveu
        não poderia ser a desta conta — um oráculo barato sobre a política de
        passwords do sistema e, pior, uma recusa diferente da recusa genérica.

        `trim_whitespace=False` na password: um espaço final é um carácter da
        password de quem o escreveu, e o DRF corta-o por omissão nos `CharField`.
        No email o default (cortar) é o que se quer — ninguém tem um email com
        espaços nas pontas e um teclado de telemóvel acrescenta-os.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    OrigemDoDocumentoEnum:
      enum:
      - upload
      - capture
      type: string
      description: |-
        * `upload` - ficheiro enviado
        * `capture` - fotografado no telemóvel
    PaginaOut:
      type: object
      description: |-
        Uma página: a ordem, a imagem e a geometria.

        `image_url` é **sempre** servido, mesmo quando não há imagem, e quem decide
        se vale a pena pedi-lo é o `normalized`. A alternativa — um `image_url` nulo
        — dava ao cliente dois campos para a mesma pergunta e um tipo
        `string | null` para um caminho que nunca muda.

        Não sai o `id` da página: o endereço dela é `(documento, position)`, que é o
        que o path usa, e um segundo identificador no payload era mais uma coisa para
        o cliente escolher mal.
      properties:
        position:
          type: integer
        image_url:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        normalized:
          type: boolean
      required:
      - height
      - image_url
      - normalized
      - position
      - width
    PaginatedConviteOutList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ConviteOut'
    PaginatedDocumentoOutList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoOut'
    PapelEnum:
      enum:
      - owner
      - manager
      - staff
      type: string
      description: |-
        * `owner` - dono
        * `manager` - gerente
        * `staff` - colaborador
    PreferenciasInRequest:
      type: object
      description: |-
        O corpo do `PATCH /auth/preferencias`: o tema que esta pessoa prefere.

        **Não tem `user_id`, e isso é a decisão.** A escrita é sempre sobre o
        `request.user`, logo não existe objecto para autorizar nem caminho para a
        preferência de outra pessoa — a forma do contrato é o que torna o abuso
        impossível, em vez de uma verificação que alguém pode esquecer. É a mesma
        mecânica com que o `tenant-ativo` recusa ser uma credencial, aplicada ao
        contrário: ali o argumento existe e é verificado pela política, aqui o
        argumento não existe.

        `ChoiceField` sobre o `Tema`: um valor fora da lista é um 400 do DRF e nunca
        chega à coluna. Isso importa mais do que parece, porque o cliente guarda uma
        **cópia** deste nome em `localStorage` (ADR 0016, decisão 3) e lê-a antes de
        haver rede — o valor ser fechado a três é o que torna essa cópia segura de
        escrever.
      properties:
        tema:
          $ref: '#/components/schemas/TemaEnum'
      required:
      - tema
    RecusaDeDocumentoOut:
      type: object
      description: |-
        O corpo de uma recusa: `code` estável para ramificar, `detail` para ler.

        A mesma forma do `ErroOutSerializer` do `accounts`, numa classe própria e não
        reutilizada — o `apps/accounts/serializers.py` não é importável de fora do
        módulo (import-linter: entre módulos só `api.py`), e expor um serializer na
        porta do `accounts` para poupar duas linhas era alargar uma interface pública
        para arrumação.

        Nome diferente (`RecusaDeDocumentoOut`) e não um segundo `ErroOut`: dois
        componentes com o mesmo nome no OpenAPI são um aviso, e o `pnpm gen:api` corre
        com `--fail-on-warn`.

        O `code` é uma string e não um enum fechado, pela razão escrita no `accounts`:
        o conjunto de códigos é **por endpoint** e um enum com a união de todos
        sugeria ao frontend ramos que aquele endpoint nunca devolve. Os códigos de
        cada resposta estão nos docstrings do `views.py`.
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    RotaDeMenuOut:
      type: object
      description: |-
        Uma rota do **registo**: o que existe para configurar, e os seus defaults.

        É a resposta do `GET /menu/rotas`, e o que ela descreve é código e não dados
        de um tenant: a lista fechada de rotas que o menu pode nomear, com o rótulo
        e o grupo por omissão, quem as pode ver, e se foram desenhadas para 360px.
        Nenhuma linha de base de dados é lida para a produzir.

        Serve um ecrã só — o painel de configuração do menu — e é por isso que
        carrega o `rotulo_default` e o `grupo_default`: são o que permite mostrar "o
        default é este" ao lado de um valor que o estabelecimento sobrepôs, e o que
        dá sentido ao botão que repõe (um `PUT` sem aquele item).

        ## `papeis_permitidos`, e não `papel_minimo`

        A ADR 0011 escreve "o papel mínimo que o registo declara". **Um mínimo exige
        uma ordem entre papéis, e essa ordem não existe neste projeto** — é a Q7,
        marcada como "não inventes default sem falar com um utilizador real" — pelo
        que o registo declara um conjunto. Dá o mesmo poder de filtragem sem afirmar
        que `manager` > `staff`; ver o `apps/accounts/menu.py` para a decisão inteira
        e para o que ficou sem resposta.

        Sai como lista de enum fechado (`PapelEnum`), logo o cliente não consegue
        inventar um papel ao mostrar o filtro. A ordem é a da declaração do `Papel`,
        para o diff do `schema.yml` não depender da iteração de um `frozenset`.

        ## `ordem_default` não está aqui

        Não é esquecimento: a ordem por omissão chega ao cliente **já aplicada** na
        projecção (o `menu` do `SessaoOut` e a resposta do `PUT`), que é o único
        sítio onde serve. Um segundo número a dizer a mesma coisa noutra forma era
        uma segunda fonte para a ordenação do menu.
      properties:
        route_id:
          $ref: '#/components/schemas/RotaIdEnum'
        papeis_permitidos:
          type: array
          items:
            $ref: '#/components/schemas/PapelEnum'
        campo:
          type: boolean
      required:
      - campo
      - papeis_permitidos
      - route_id
    RotaIdEnum:
      enum:
      - inicio
      - painel
      - alertas
      - stock
      - contar
      - receber
      type: string
      description: |-
        * `inicio` - Início
        * `painel` - Painel de gestão
        * `alertas` - Alertas
        * `stock` - Stock
        * `contar` - Contar
        * `receber` - Receber
    SessaoOut:
      type: object
      description: |-
        A resposta dos cinco endpoints de autenticação. Sempre esta forma.

        Uma forma só para login, logout, leitura da sessão, troca de estabelecimento
        e preferências: o cliente guarda-a numa entrada de cache e qualquer das
        cinco respostas a substitui, em vez de cinco formas e cinco ramos de Zod.

        `utilizador` e `tenant_ativo` são `null` em vez de ausentes, e isso é
        deliberado: um campo que às vezes não existe obriga o cliente a distinguir
        "não sei" de "não há", e aqui o servidor sabe sempre.
      properties:
        estado:
          $ref: '#/components/schemas/SessaoOutEstadoEnum'
        utilizador:
          allOf:
          - $ref: '#/components/schemas/UtilizadorOut'
          nullable: true
        tenant_ativo:
          allOf:
          - $ref: '#/components/schemas/TenantOut'
          nullable: true
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantOut'
        menu:
          type: array
          items:
            $ref: '#/components/schemas/ItemDeMenuOut'
      required:
      - estado
      - menu
      - tenant_ativo
      - tenants
      - utilizador
    SessaoOutEstadoEnum:
      enum:
      - anonimo
      - sem_estabelecimento
      - escolha_pendente
      - ativa
      type: string
      description: |-
        * `anonimo` - sem sessão
        * `sem_estabelecimento` - sem estabelecimento associado
        * `escolha_pendente` - à espera da escolha do estabelecimento
        * `ativa` - sessão com estabelecimento ativo
    TemaEnum:
      enum:
      - escuro
      - meio_termo
      - claro
      type: string
      description: |-
        * `escuro` - Escuro
        * `meio_termo` - Meio termo
        * `claro` - Claro
    TenantAtivoInRequest:
      type: object
      description: |-
        O corpo do `POST /auth/tenant-ativo`: o estabelecimento a activar.

        É um **argumento e não uma credencial** (ADR 0007). O que este serializer
        garante é só que o valor é um UUID — quem verifica se quem pede tem pertença
        ativa lá é a política, dentro do `tenant_scope` que o service abre. Um
        `PrimaryKeyRelatedField` sobre `Tenant.objects` seria errado por duas razões
        e vale dizê-las: a queryset corre **fora** de âmbito, logo a política
        devolveria zero linhas e nenhum uuid passaria nunca; e com âmbito devolveria
        uma mensagem de validação a distinguir "não existe" de "não é teu".
      properties:
        tenant_id:
          type: string
          format: uuid
      required:
      - tenant_id
    TenantOut:
      type: object
      description: |-
        Um estabelecimento como o seletor o mostra: id, nome e o papel de quem vê.

        Serve as duas posições da resposta — o `tenant_ativo` e cada entrada de
        `tenants` — porque são a mesma coisa em dois estados, e duas classes
        idênticas davam dois componentes iguais no OpenAPI.

        O `papel` é o do par (utilizador, estabelecimento) e vem do `Membership`
        confirmado pela política: a mesma pessoa é dona de um e colaboradora noutro.
        Sai como enum fechado no OpenAPI, logo a união chega ao `types.ts`.

        `demonstracao` entrou com a ADR 0018 e é a **única** diferença visível de um
        estabelecimento de demonstração. Viaja aqui — e não num endpoint próprio —
        porque é exactamente o que o cromado precisa e porque chega de graça: esta
        forma já está no `tenant_ativo` e em cada entrada de `tenants`, que são os
        dois sítios onde a faixa e o item marcado o vão ler, sem um pedido novo.

        O nome é **duplo de propósito**: a coluna chama-se `is_demo` porque segue a
        convenção de booleano da sua tabela (`is_active`, `is_staff`) e o campo
        chama-se `demonstracao` porque segue o vocabulário português dos endpoints
        deste módulo (`papel`, `rotulo`, `visivel`). É o `source` que os casa, num
        sítio só.
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
          maxLength: 200
        papel:
          $ref: '#/components/schemas/PapelEnum'
        demonstracao:
          type: boolean
      required:
      - demonstracao
      - id
      - nome
      - papel
    UtilizadorOut:
      type: object
      description: |-
        Quem está autenticado: id e email, e mais nada.

        O `UserOut` do `api.py` traz também `is_active` e `is_staff`, e os dois
        ficam de fora. O `is_active` porque uma conta inativa não autentica, logo o
        campo só poderia valer `true` — um campo constante é ruído no contrato. O
        `is_staff` porque não há nada no frontend que dele dependa: o admin é uma
        aplicação à parte, num path próprio, e o que decide o que um pedido pode
        fazer é o papel do `Membership` (ADR 0007), nunca esta flag.

        O nome da pessoa também não está aqui: vive no `Membership`, é por
        estabelecimento ("Ana Silva (contabilidade)" num, "Ana" noutro) e entra no
        contrato quando houver um ecrã que o mostre.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        tema:
          $ref: '#/components/schemas/TemaEnum'
      required:
      - email
      - id
      - tema
    VatRegimeEnum:
      enum:
      - normal
      - isento_art_53
      type: string
      description: |-
        * `normal` - Regime normal
        * `isento_art_53` - Isento (art. 53.º)
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
