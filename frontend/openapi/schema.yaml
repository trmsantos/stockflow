    RecusaDeDocumentoOut:
      type: object
      description: |-
        O corpo de uma recusa: `code` estável para ramificar, `detail` para ler.

        A mesma forma do `ErroOutSerializer` do `accounts`, numa classe própria e não
        reutilizada — o `apps/accounts/serializers.py` não é importável de fora do
        módulo (import-linter: entre módulos só `api.py`), e expor um serializer na
        porta do `accounts` para poupar duas linhas era alargar uma interface pública
        para arrumação.

        Nome diferente (`RecusaDeDocumentoOut`) e não um segundo `ErroOut`: dois
        componentes com o mesmo nome no OpenAPI são um aviso, e o `pnpm gen:api` corre
        com `--fail-on-warn`.

        O `code` é uma string e não um enum fechado, pela razão escrita no `accounts`:
        o conjunto de códigos é **por endpoint** e um enum com a união de todos
        sugeria ao frontend ramos que aquele endpoint nunca devolve. Os códigos de
        cada resposta estão nos docstrings do `views.py`.
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    RecusaDoAssistenteOut:
      type: object
      description: 'O corpo de uma recusa: `code` da lista fechada e `detail` traduzido.'
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    RecusaDoPainelOut:
      type: object
      description: |-
        O corpo de um 403 ou de um 400: **só `detail`, sem `code` novo** (ADR 0013, d6).

        É a forma exacta que o DRF já devolve. Não reutiliza o `ErroOutSerializer`
        do `accounts` — esse não é importável de fora do módulo —, e não tem `code`
        porque este endpoint não tem ramos de recusa para o cliente distinguir: ou
        é dono, ou não é.
      properties:
        detail:
          type: string
      required:
      - detail
    RespostaDeQuebraOut:
      type: object
      description: |-
        O 201 de `POST /stock/movements/waste`: **sempre uma lista**.

        Mesmo com um lote só. Uma resposta que é objecto no caso normal e lista no
        caso raro é um cliente que funciona até ao dia em que o lote acaba a meio
        (ADR 0034, decisão 8) — e é a forma que o 201 da transferência já tem.

        Sem mixin próprio: o dinheiro está nas linhas, e o `context` chega-lhes
        pelo `root`.
      properties:
        movements:
          type: array
          items:
            $ref: '#/components/schemas/MovimentoOut'
          readOnly: true
