      - warning
      - info
      type: string
      description: |-
        * `danger` - danger
        * `warning` - warning
        * `info` - info
    IdDeCustoEnum:
      enum:
      - purchases
      - goods_consumed
      - waste
      - unknown_shrinkage
      - payroll
      - other
      type: string
      description: |-
        * `purchases` - purchases
        * `goods_consumed` - goods_consumed
        * `waste` - waste
        * `unknown_shrinkage` - unknown_shrinkage
        * `payroll` - payroll
        * `other` - other
    IdDeParteDeSalariosEnum:
      enum:
      - base
      - social_security
      - subsidies
      - meal_allowance
      - insurance
      type: string
      description: |-
        * `base` - base
        * `social_security` - social_security
        * `subsidies` - subsidies
        * `meal_allowance` - meal_allowance
        * `insurance` - insurance
    IdDeSerieEnum:
      enum:
      - revenue
      - purchases
      type: string
      description: |-
        * `revenue` - revenue
        * `purchases` - purchases
    IntervaloOut:
      type: object
      description: O intervalo de um ponto. Viaja uma vez, não por série.
      properties:
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
      required:
      - since
      - until
    ItemDeMenuInRequest:
      type: object
      description: |-
        Uma linha do corpo do `PUT /menu`: o que o tenant decidiu sobre uma rota.

        Os quatro campos configuráveis, e nada mais. **Não** há `campo`, e isso é
        estrutural e não uma omissão: se a forma que a configuração transporta
        tivesse esse campo, uma empresa conseguia promover uma rota de escritório
        para o telemóvel escrevendo `campo: true` — e o predicado que diz "este ecrã
        foi desenhado para 360px" é código (ADR 0009, adenda 2). Também não há
        `caminho` nem `icone`: a árvore de rotas é código, e um menu que nomeasse
        caminhos punha o deep link a depender da configuração.

        O `route_id` é um `ChoiceField` sobre o enum fechado do backend, e é essa
        linha que impede a tabela de ser um armazém chave/valor: um id inventado é
        400 por campo, não uma linha guardada que ninguém sabe ler.

        `rotulo` é opcional e pode vir `null`; os outros três são obrigatórios,
        porque o corpo é a configuração **inteira** e não um `PATCH` — "mantém o que
        estava" não é uma intenção que este endpoint consiga ter.

        `allow_blank=False` no `rotulo`: um rótulo vazio não é um rótulo. Quem quer
        o default manda `null` ou omite-o, e a coluna guarda `""` para essa ausência
        (ver o modelo) — um sítio só a traduzir as duas formas.
      properties:
        route_id:
          $ref: '#/components/schemas/RotaIdEnum'
        grupo:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
        ordem:
          type: integer
          maximum: 32767
          minimum: 0
        visivel:
          type: boolean
        rotulo:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
      required:
      - ordem
      - route_id
      - visivel
    ItemDeMenuOut:
      type: object
      description: |-
        Um item do menu **já resolvido**: o registo com a configuração por cima.

        A tupla da ADR 0009 — `(route_id, grupo, ordem, visivel, rotulo)` —, uma
        lista com um nível de agrupamento e nunca uma árvore ("esconder e reordenar
        uma árvore é um problema muito maior e 'cresce' não precisa dele").

        Serve as **duas** posições onde o menu aparece: o `menu` do `SessaoOut`
        (filtrado pelo papel de quem pede) e a resposta do `PUT /menu` (a
        configuração inteira, como ficou). Uma classe e não duas porque a forma é a
        mesma e duas idênticas davam dois componentes iguais no OpenAPI, logo dois
        esquemas de Zod a divergir. A diferença entre as duas posições é **o
        conjunto de linhas**, não a forma de cada uma, e está escrita no
        `selectors.projeccao_de_menu`.

        `visivel` vem com o seu valor e não filtrado: esconder é apresentação e a
        rota continua a funcionar por deep link (ADR 0009) — quem esconde é o
        cliente, e o painel precisa de ver o que está escondido para o poder mostrar
        outra vez. Filtrar aqui transformava "esconder" num controlo de acesso
        falso e um marcador guardado num 404.

        `rotulo` é `null` quando o tenant não sobrepôs nada, e **não** o rótulo do
        registo já resolvido: o cliente faz `rotulo ?? registo.rotulo`, que é o que
        o `montarMenu` do shell já escreve. O porquê está no `menu.ItemDeMenu` — em
        resumo, resolvê-lo aqui prendia o tenant a um default que ele nunca escolheu.

        **Não** leva `campo`: o que esta lista transporta é configuração, e o
        predicado de rota de campo é código (ADR 0009, adenda 2). Quem o quer pede
        `GET /menu/rotas`, que é o registo.
      properties:
        route_id:
          $ref: '#/components/schemas/RotaIdEnum'
        grupo:
          type: string
          nullable: true
          maxLength: 50
        ordem:
          type: integer
        visivel:
          type: boolean
        rotulo:
          type: string
          nullable: true
          maxLength: 50
      required:
      - grupo
      - ordem
      - rotulo
      - route_id
      - visivel
    KeyEnum:
      enum:
      - today
      - 7d
      - 30d
      - month
      - prev_month
      type: string
      description: |-
        * `today` - today
        * `7d` - 7d
        * `30d` - 30d
        * `month` - month
        * `prev_month` - prev_month
    LanguageEnum:
      enum:
      - pt-pt
      - en
      type: string
      description: |-
        * `pt-pt` - Português (Portugal)
        * `en` - English
    LinhaDeContagemInRequest:
      type: object
      description: |-
        `POST /stock/counts/{id}/lines`: o artigo e quanto lá está.

        Sem `sku` (morreu com o contrato do servidor) e sem `unit` — o `unit` era
        pior que morto: era aceite e **silenciosamente ignorado** pelo serviço.
      properties:
        product:
          type: string
          format: uuid
          description: UUID do artigo contado
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          description: 'Quantidade contada, na unidade de contagem da linha (`count_unit`,
            que é a de apresentação do artigo: kg, L, un). O servidor converte para
            a unidade base — converter no cliente é o que o domínio proíbe.'
      required:
      - product
      - quantity
    LinhaDeContagemOut:
      type: object
      description: |-
        Uma linha: o que o sistema diz, o que se contou e a diferença.

        **`difference_eur` passou de `null` a ausente** a 2026-10-21 (ADR 0032,
        decisão 5). A ADR 0030 escolhera `null` e nomeara o preço: *"`null` passa a
        dizer duas coisas — ainda não contado e não te é mostrado"*. A chave ausente
        diz a segunda sem apagar a primeira — `difference` presente com
        `difference_eur` ausente é inequívoco — e é a forma que o resto do sistema
        já usa, incluindo o módulo ao lado. Duas formas da mesma política dentro do
        mesmo módulo era o que a decisão 4 desta ADR acabara de desfazer.

        O que o colaborador continua a receber: a lista inteira, o esperado, o
        contado, a diferença em quantidade, quem contou e quando.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        short_name:
          type: string
          readOnly: true
        zone:
          allOf:
          - $ref: '#/components/schemas/ZonaOut'
          readOnly: true
        position:
          type: integer
          readOnly: true
        count_unit:
          type: string
          readOnly: true
        expected:
          allOf:
          - $ref: '#/components/schemas/QuantidadeOut'
          readOnly: true
          nullable: true
        counted:
          allOf:
          - $ref: '#/components/schemas/QuantidadeOut'
          readOnly: true
          nullable: true
        difference:
          allOf:
          - $ref: '#/components/schemas/QuantidadeOut'
          readOnly: true
          nullable: true
        difference_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        counted_by:
          type: string
          readOnly: true
          nullable: true
        counted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    LinhaInRequest:
      type: object
      description: |-
        Entrada para criar linha de receção (à mão).

        Os três campos de referência chamam-se `product`, `packaging` e `location`
        no contrato e `*_id` do lado de dentro — e a tradução **faltava aqui**,
        exactamente como faltava no `RevisaoDeLinhaInSerializer` até 2026-10-19. A
        consequência era a mesma com outro nome: a view entregava o
        `validated_data` ao Django, que recusa um `UUID` onde a descritora de uma
        chave estrangeira quer uma instância (*"Cannot assign UUID(...):
        ReceiptLine.location must be a Location instance"*) — **500 em todos os
        `POST /receipts/<id>/lines`**, que é o caminho de acrescentar uma linha à
        mão a uma receção.

        Os três têm `required=False` e isso continua a ser o contrato: uma linha
        acrescentada à mão nasce por rever, e é a revisão que lhe escolhe o artigo.
        Quem resolve a ausência de `location` é o `services.acrescentar_linha`,
        porque a coluna é `NOT NULL` e o default certo — a localização da receção —
        é um facto do domínio e não do transporte.
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
        invoice_unit:
          type: string
          minLength: 1
          maxLength: 20
        quantity_invoiced:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          nullable: true
        discount_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          nullable: true
        vat_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          nullable: true
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        supplier_code:
          type: string
          maxLength: 50
        ean:
          type: string
          maxLength: 14
        variable_weight:
          type: boolean
          default: false
        kind:
          allOf:
          - $ref: '#/components/schemas/TipoDeLinhaDeRececaoEnum'
          default: goods
        product:
          type: string
          format: uuid
          nullable: true
        packaging:
          type: string
          format: uuid
          nullable: true
        base_per_invoice_unit:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          nullable: true
        quantity_received:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        location:
          type: string
          format: uuid
        lot_code:
          type: string
          maxLength: 40
        expires_at:
          type: string
          format: date
          nullable: true
      required:
      - description
      - invoice_unit
      - quantity_invoiced
    LinhaLidaOut:
      type: object
      description: |-
        Uma linha **como o modelo a leu**. Texto não confiável, já validado.

        Chega aqui depois de o `agents` a ter validado contra o seu schema à escrita
        **e** à leitura (ADR 0021, decisão 4: *"é a única coluna do sistema em que
        nada se confia"*). O que este serializer acrescenta é a terceira passagem, a
        da forma do contrato: os `max_length` e os `decimal_places` são os que o
        `types.ts` vai prometer ao frontend.

        Os números são `Decimal` com `coerce_to_string` implícito (o default do DRF):
        saem como string no JSON, que é a única forma de um preço não passar por um
        `float` do JavaScript.

        **Os euros só saem para `owner|manager`** — é a mesma decisão do dono e a
        mesma mecânica do `LinhaOutSerializer`, aplicada ao caminho irmão. A ADR
        0031 (adenda dos euros) fechou a receção e deixou esta janela aberta sobre
        **a mesma fatura e os mesmos preços**: um colaborador que abrisse o
        documento via o painel de leitura inteiro.
      properties:
        position:
          type: integer
        description:
          type: string
          maxLength: 500
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          nullable: true
        unit:
          type: string
          maxLength: 20
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          nullable: true
        vat_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          nullable: true
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        confidence:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,3})?$
          nullable: true
        supplier_code:
          type: string
          maxLength: 50
        ean:
          type: string
          maxLength: 14
        discount_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          nullable: true
      required:
      - confidence
      - description
      - ean
      - position
      - quantity
      - supplier_code
      - unit
      - vat_rate
