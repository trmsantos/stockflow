      summary: Guardar a configuração deste estabelecimento
      tags:
      - estabelecimento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstabelecimentoInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstabelecimentoOut'
          description: ''
        '403':
          content:
