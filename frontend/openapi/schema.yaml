    ResumoDeAlertasOut:
      type: object
      description: |-
        Os contadores do topo do ecrã de Alertas (`GET /stock/alerts/summary`).

        Endpoint e não derivação da lista (ADR 0034, decisão 5): a lista vem
        paginada a 50 e os dois agregados do desperdício são janelas de dia de
        negócio que a lista de alertas não contém.

        ## O `staff` perde dois euros e ganha quatro contagens

        `wasted_today_eur` e `wasted_week_eur` continuam ausentes para quem não vê
        euros. Em troca, `wasted_*_count` e `wasted_*_lines_without_cost` estão
        **presentes para os três papéis** — são contagens e não euros, e um
        `COUNT(id)` não tem numerador nem denominador, logo nenhuma sequência de
        observações reconstrói um custo unitário a partir dele (ADR 0034, d10).

        A razão é de **navegação**: os dois números em euros eram as duas únicas
        portas para a lista de desperdício, e a decisão 4 diz expressamente que
        essa lista tem de chegar ao `staff`. Sem contador, a rota existia sem ter
        quem lá entrasse.

        A cobertura entra pela régua da ADR 0032: "7 quebras hoje" e "7 quebras
        hoje, 4 sem preço conhecido" não são a mesma frase.
      properties:
        expiring_count:
          type: integer
          readOnly: true
          description: Linhas da lista de alertas de validade.
        expiring_within_days:
          type: integer
          readOnly: true
        missing_count:
          type: integer
          readOnly: true
        business_day_starts_at:
          type: string
          readOnly: true
          description: '`"04:00"`, hora local do estabelecimento.'
        wasted_since:
          type: string
          format: date-time
          readOnly: true
        wasted_today_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          description: Ausente para quem não vê euros.
        wasted_week_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          description: Ausente para quem não vê euros.
        wasted_today_count:
          type: integer
          readOnly: true
        wasted_week_count:
          type: integer
          readOnly: true
        wasted_today_lines_without_cost:
          type: integer
          readOnly: true
        wasted_week_lines_without_cost:
          type: integer
          readOnly: true
    ResumoDeStockOut:
      type: object
      description: |-
        Os quatro números do topo do ecrã de Stock (`GET /stock/summary`).

        `below_min_count` e `expiring_count` são, por construção, o `count` de
        `/stock/levels?filtro=falta` e de `?filtro=validade` no mesmo âmbito — ver
        `selectors.resumo_de_stock`. O `expiring_within_days` viaja com o número
        para o ecrã poder mostrar o limiar em vez de o esconder num painel de
        configurações.

        O `expiring_count` daqui conta **artigos**; o do `/stock/alerts/summary`
        conta **linhas da lista de alertas**. São dois factos com dois rótulos.
      properties:
        below_min_count:
          type: integer
          readOnly: true
        expiring_count:
          type: integer
          readOnly: true
        expiring_within_days:
          type: integer
          readOnly: true
        stock_value_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          description: Σ do valor dos artigos com saldo positivo — um saldo negativo
            não baixa o valor do stock. Ausente para quem não vê euros.
    ResumoDoPeriodoOut:
      type: object
      description: |-
        `GET /reporting/summary`. **Sem total de gastos e sem resultado**, de propósito.

        Os dois vivem só no `/month`: um total com a mercadoria discriminada ao lado
        dá a folha salarial por subtracção (ADR 0013, decisão 6). Hoje o painel
        inteiro é do dono e não há ninguém a quem isso exponha nada — o invariante
        fica para o dia em que um bloco se abrir ao encarregado.
