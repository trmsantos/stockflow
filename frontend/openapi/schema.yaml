components:
  schemas:
    AcaoOut:
      type: object
      description: |-
        Um botão do turno: para onde vai, com que parâmetros e que palavra usa.

        **Derivada e não guardada** (ADR 0028, decisão 4): o `MensagemOut` calcula-a
        dos `tool_calls` revalidados do turno pelo mapa fechado do `navegacao.py`.

        `rota` e `rotulo_id` são `ChoiceField` sobre listas fechadas de propósito: é
        o que os faz sair como união no `types.ts` e o que torna um id que o cliente
        não conheça um erro de compilação em vez de um botão sem palavra — o mesmo
        mecanismo do registo de rotas da ADR 0009. **Nenhum rótulo nosso viaja no
        arame** (ADR 0019): o que sai é o id, e a palavra resolve-se no catálogo do
        cliente.

        `parametros` é um mapa de strings porque mistura o parâmetro de caminho de
        uma rota de detalhe (o `artigo` de `/stock/<artigo>`) com os de procura
        (`?ver=falta`), e os valores são ora um uuid ora um membro de um `z.enum`.
        Os valores nunca vêm do modelo — saem do mapa em código ou de um id que uma
        tool já validou —, e é isso, e não o tipo do campo, que os fecha.
      properties:
        rota:
          $ref: '#/components/schemas/RotaEnum'
        parametros:
          type: object
          additionalProperties:
            type: string
        rotulo_id:
          $ref: '#/components/schemas/RotuloIdEnum'
      required:
      - parametros
      - rota
      - rotulo_id
    AjusteInRequest:
      type: object
      description: |-
        `POST /stock/movements/adjustment`: a correcção, com sinal.

        A quantidade continua a ser em unidade **base**: a decisão 11 da ADR 0034
        deu o `unit` à quebra, que é a que o ecrã serve, e esta rota não tem ecrã
        nenhum nesta fatia. Está nomeado aqui para a assimetria ser visível a quem
        lhe der um.
      properties:
        product:
          type: string
          format: uuid
          description: UUID do artigo
        location:
          type: string
          format: uuid
          description: UUID da localização
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          description: Quantidade ± em unidade base (positivo = entrada).
        lot:
          type: string
          format: uuid
          nullable: true
        reason:
          $ref: '#/components/schemas/MotivoDeQuebraEnum'
        reason_detail:
          type: string
          maxLength: 500
      required:
      - location
      - product
      - quantity
      - reason
    AlertaOut:
      type: object
      description: |-
        Uma linha do `GET /stock/alerts`: duas perguntas, **uma** lista.

        O `id` não é um uuid: é `expiry:<lot_id>:<location_id>` ou
        `missing:<product_id>`. A localização entra na chave porque um lote
        transferido tem saldo em duas prateleiras e `expiry:<lot_id>` produzia
        **dois ids iguais** — o painel expandia a linha errada. Agregar por lote
        não era alternativa: o `location` passava a `null` e o `POST` de quebra da
        linha levaria `""`, que é 400.

        `value_eur` só vai a `owner|manager`. Num alerta de validade é o valor em
        risco; num de falta é o que custa voltar ao mínimo — e o ecrã diz qual dos
        dois é. O `cost_status` fica para todos: é qualidade de dados e não um euro.
      properties:
        id:
          type: string
