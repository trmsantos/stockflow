    UtilizadorOut:
      type: object
      description: |-
        Quem está autenticado: id e email, e mais nada.

        O `UserOut` do `api.py` traz também `is_active` e `is_staff`, e os dois
        ficam de fora. O `is_active` porque uma conta inativa não autentica, logo o
        campo só poderia valer `true` — um campo constante é ruído no contrato. O
        `is_staff` porque não há nada no frontend que dele dependa: o admin é uma
        aplicação à parte, num path próprio, e o que decide o que um pedido pode
        fazer é o papel do `Membership` (ADR 0007), nunca esta flag.

        O nome da pessoa também não está aqui: vive no `Membership`, é por
        estabelecimento ("Ana Silva (contabilidade)" num, "Ana" noutro) e entra no
        contrato quando houver um ecrã que o mostre.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        tema:
          $ref: '#/components/schemas/TemaEnum'
      required:
      - email
      - id
      - tema
    ValidadeProximaOut:
      type: object
      description: |-
        O lote que vence primeiro, com a data, os dias e **a gravidade**.

        Três formas que mudaram com a ADR 0034 e que o cliente valida à chegada:

        * `expires_at` é uma **data** e não um instante (defeito (a)): um instante
          tem fuso e a data impressa na embalagem não muda com quem a lê;
        * `kind` é **nulável**: o `expiry_kind` do `catalog` é `""` por omissão e o
          `tipoValidadeSchema` do cliente não aceita `""`, logo traduz-se para
          `null` e a gravidade lê-se pela coluna estrita da tabela da decisão 9;
        * `lot_code` é **nulável**: um lote sintético (`__<uuid>__`) existe para o
          ledger ter uma chave e não para alguém o ler. Sem isto, a primeira
          produção de receita rebentava o ecrã de Alertas.

        A `severity` é nova e é o que fecha a quarta definição de gravidade: sem
        ela o cliente é **obrigado** a recalcular a cor para pintar o trilho (ADR
        0034, decisão 9). A palavra continua a ser dele, porque i18n é dele; a cor
        e a urgência passam a ser do servidor.
      properties:
        lot_id:
          type: string
          format: uuid
          readOnly: true
        lot_code:
          type: string
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date
          readOnly: true
        days_away:
          type: integer
          readOnly: true
          description: Dias até à validade; negativo se já passou.
        kind:
          readOnly: true
          nullable: true
          description: |-
            `null` num artigo sem rótulo de validade.

            * `use_by` - use_by
            * `best_before` - best_before
          oneOf:
          - $ref: '#/components/schemas/TipoDeValidadeEnum'
          - $ref: '#/components/schemas/NullEnum'
        severity:
          allOf:
          - $ref: '#/components/schemas/GravidadeEnum'
          readOnly: true
    VatBreakdown:
      type: object
      description: Breakdown de IVA.
      properties:
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
        base:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        vat:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - base
      - rate
      - vat
    VatRegimeEnum:
      enum:
      - normal
      - isento_art_53
      type: string
      description: |-
        * `normal` - Regime normal
        * `isento_art_53` - Isento (art. 53.º)
    WarningsEnum:
      enum:
      - total_nao_bate
      - taxa_desconhecida
      - sem_taxa
      - sem_quantidade
      - sem_conversao
      - preco_desviado
      - confianca_baixa
      type: string
      description: |-
        * `total_nao_bate` - total_nao_bate
        * `taxa_desconhecida` - taxa_desconhecida
        * `sem_taxa` - sem_taxa
        * `sem_quantidade` - sem_quantidade
        * `sem_conversao` - sem_conversao
        * `preco_desviado` - preco_desviado
        * `confianca_baixa` - confianca_baixa
    ZonaOut:
      type: object
      description: |-
        Uma zona da contagem. Nesta fatia a zona **é** a localização (ADR 0030, d3).

        `blind` é facto e não marcador de lugar: nenhuma zona é cega porque a
        contagem cega não existe — é sonda do guião §3 e fica fora de âmbito.
      properties:
        slug:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        position:
          type: integer
          readOnly: true
        blind:
          type: boolean
          readOnly: true
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
