          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        cost_status:
          allOf:
          - $ref: '#/components/schemas/EstadoDoCustoEnum'
          readOnly: true
          description: |-
            Qualidade do custo com que o movimento foi avaliado.

            * `conhecido` - conhecido
            * `estimado` - estimado
            * `desconhecido` - desconhecido
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          readOnly: true
          description: Ausente para quem não vê euros.
        created_at:
          type: string
          format: date-time
          readOnly: true
    StockQuantity:
      type: object
      description: Quantidade em stock após receção.
      properties:
        base:
          type: string
