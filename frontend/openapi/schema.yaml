          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          description: Unidades base por unidade de apresentação
        track_lots:
          type: boolean
          default: false
          description: Se exige lote
        expiry_kind:
          nullable: true
          default: ''
          description: |-
            use_by ou best_before

            * `` - Sem rótulo
            * `use_by` - consumir até
            * `best_before` - consumir de preferência antes de
          oneOf:
          - $ref: '#/components/schemas/ExpiryKindEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
