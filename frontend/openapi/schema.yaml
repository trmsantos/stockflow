          description: Rótulo único por artigo (sem caixa)
          maxLength: 60
        base_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          description: Unidades base por embalagem
        ean:
          type: string
          nullable: true
          default: ''
          description: 8, 12, 13 ou 14 dígitos com dígito de controlo
          maxLength: 14
      required:
      - base_quantity
      - label
    EmbalagemReference:
      type: object
      description: Referência a uma embalagem (para LinhaOut).
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 60
        base_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        base_unit:
          type: string
          maxLength: 2
      required:
      - base_quantity
      - base_unit
      - id
      - label
    ErroOut:
      type: object
      description: |-
        O corpo de uma recusa: `code` estável para ramificar, `detail` para ler.

        É a mesma forma que o `TenantMiddleware` já devolve (`sem_sessao`,
        `tenant_desconhecido`, `tenant_divergente`), e está aqui para entrar no
        `schema.yml`: sem isto, o cliente gerado conhecia as respostas de sucesso e
        tratava as recusas como `unknown`, que é precisamente onde o frontend tem de
        ramificar.

        O `code` é uma string e não um enum fechado de propósito: o conjunto de
        códigos é **por endpoint** (`credenciais_invalidas` só no login,
        `conta_bloqueada` só no 429) e um enum único com a união de todos sugeria ao
        frontend ramos que aquele endpoint nunca devolve. Os códigos de cada resposta
        estão nos docstrings do `views.py`.
      properties:
        code:
          type: string
        detail:
          type: string
      required:
      - code
      - detail
    ErrorCodeEnum:
      enum:
      - teto_de_iteracoes
      - teto_de_custo
      - tempo_esgotado
      - resposta_invalida
      - erro_do_modelo
      - modelo_ocupado
      - pertenca_revogada
      type: string
      description: |-
        * `teto_de_iteracoes` - o modelo chamou tools demasiadas vezes
        * `teto_de_custo` - o orçamento diário do estabelecimento esgotou-se
        * `tempo_esgotado` - o modelo não respondeu a tempo
        * `resposta_invalida` - a resposta do modelo não se lê
        * `erro_do_modelo` - o fornecedor do modelo recusou a chamada
        * `modelo_ocupado` - o fornecedor está sobrecarregado
        * `pertenca_revogada` - quem perguntou já não pertence ao estabelecimento
    EstabelecimentoInRequest:
      type: object
      description: |-
        O corpo do `PATCH /estabelecimento`: os três campos configuráveis.

        **Não há `demonstracao` e não há `id`.** O primeiro é só de leitura (a razão
        está no modelo: marcar um estabelecimento real como demonstração era esconder
        dados reais atrás de um aviso de "isto é de brincar"); o segundo não existe
        porque qual é o estabelecimento decide-se no âmbito e não no corpo — é a
        mesma forma com que o `PreferenciasInSerializer` não tem `user_id`. Não é uma
        verificação que a view faz: é um argumento que não existe.

        ## `PATCH` com os três campos obrigatórios, e é coerente e não contraditório

        Hoje o corpo tem de os trazer todos, logo isto comporta-se como um `PUT`. O
        método é `PATCH` pelo que acontece **depois**: um quarto campo entra como
        `required=False` e nenhum cliente antigo tem de ser alterado, enquanto com
        `PUT` a semântica obrigava-o a reenviar tudo e um cliente que não conhecesse
        o campo novo apagava-o. É a mesma escolha do `/auth/preferencias`, e é
        compatível com o `COMPONENT_SPLIT_PATCH = False` das settings — nenhuma view
        desta casa valida com `partial=True`, pelo que o `types.ts` gerado diz que os
        três são obrigatórios, que é a verdade.

        ## A janela do dia de negócio é validada aqui **e** na base de dados

        O `TimeField` recusa `"25:00"` por forma, e o `validate_business_day_starts_at`
        recusa `"16:00"` por domínio — com a frase que aparece debaixo do campo. A
        `CheckConstraint` da migração 0009 é a **rede**: um dia de negócio às 16:00
        parte todos os dias em dois em silêncio, e a linha não deve conseguir existir
        venha de onde vier. É a mesma relação que o menu tem com a sua unicidade.
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 200
        vat_regime:
          $ref: '#/components/schemas/VatRegimeEnum'
        business_day_starts_at:
          type: string
          format: time
      required:
      - business_day_starts_at
      - nome
      - vat_regime
    EstabelecimentoOut:
      type: object
      description: |-
        A resposta do `GET` e do `PATCH /estabelecimento` (ADR 0017).

        **Não é o `TenantOutSerializer`**, e a diferença é a razão de existirem os
        dois: aquele descreve o estabelecimento como o **seletor** o mostra — id,
        nome e o papel de quem está a ver — e viaja em cada resposta de sessão. Este
        descreve a **entidade**: o que ela é e como está configurada, sem papel
        nenhum, porque a configuração não muda com quem olha. Juntá-los punha o
        regime de IVA em cada `GET /auth/sessao` de cada colaborador.

        `business_day_starts_at` sai como `"04:00"` e não `"04:00:00"`: o `format`
        está explícito porque o default do DRF é `"%H:%M:%S"`, e o que o contrato da
        ADR 0017 fixa — e o que um `<input type="time">` consome — são horas e
        minutos. Os segundos seriam três caracteres que nunca são outra coisa que
        `00`.
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        vat_regime:
          $ref: '#/components/schemas/VatRegimeEnum'
        business_day_starts_at:
          type: string
          format: time
        demonstracao:
          type: boolean
      required:
      - business_day_starts_at
      - demonstracao
      - id
      - nome
      - vat_regime
    EstadoDaLeituraEnum:
      enum:
      - pendente
      - lido
      - ilegivel
      - erro
      type: string
      description: |-
        * `pendente` - a chamada começou e não acabou
        * `lido` - o modelo respondeu e a resposta valida
        * `ilegivel` - o modelo respondeu e a resposta não valida
        * `erro` - a chamada falhou
    EstadoDaMensagemEnum:
      enum:
      - pendente
      - a_responder
      - respondida
      - erro
      type: string
      description: |-
        * `pendente` - à espera de um worker
        * `a_responder` - o modelo está a responder
        * `respondida` - respondida
        * `erro` - a resposta falhou
    EstadoDeContagemEnum:
      enum:
      - open
      - closed
      type: string
      description: |-
        * `open` - open
        * `closed` - closed
    EstadoDoCustoEnum:
      enum:
      - conhecido
      - estimado
      - desconhecido
      type: string
      description: |-
        * `conhecido` - conhecido
        * `estimado` - estimado
        * `desconhecido` - desconhecido
    EstadoDoDocumentoEnum:
      enum:
      - aguarda_captura
      - expirado
      - a_normalizar
      - a_extrair
      - lido
      - ilegivel
      - erro
      - descartado
      type: string
      description: |-
        * `aguarda_captura` - slot aberto, à espera da primeira página
        * `expirado` - o slot expirou sem página nenhuma
        * `a_normalizar` - há páginas e a imagem ainda não está pronta
        * `a_extrair` - o modelo está a ler o documento
        * `lido` - o modelo leu e o resultado está disponível
        * `ilegivel` - o modelo respondeu algo que não se consegue validar
        * `erro` - a extração falhou ou nunca acabou
        * `descartado` - descartado por uma pessoa
    EstadoDoNivelEnum:
      enum:
      - negativo
      - esgotado
      - baixo
      - ok
      type: string
      description: |-
        * `negativo` - negativo
        * `esgotado` - esgotado
        * `baixo` - baixo
        * `ok` - ok
    ExpiryKindEnum:
      enum:
      - use_by
      - best_before
      type: string
      description: |-
        * `` - Sem rótulo
        * `use_by` - consumir até
        * `best_before` - consumir de preferência antes de
    ExtracaoOut:
      type: object
      description: |-
        O que o modelo leu, num painel **só de leitura**.

        É a entrega da fatia 1 ao dono: *"arrastar um PDF no desktop, ver as páginas,
        e ver o que o modelo leu"*. Nada disto é a verdade do estabelecimento — a
        verdade é o que uma pessoa confirmar na revisão, que é a fatia 2 — e por isso
        o cabeçalho e as linhas vêm **vazios** quando o estado não é `lido`.

        `reason` é a razão legível de um `erro`, e existe porque hoje o erro é sempre
        o mesmo e tem uma explicação curta: não há modelo configurado. Um estado
        `erro` sem frase mandava alguém ler logs do worker. **Não está no
        `ExtracaoOut` da ADR** — é um campo aditivo, e o nome vai em inglês como os
        vizinhos (decisão 9), apesar de o campo do DTO interno se chamar `motivo`
        como o resto do Python deste repositório.

        ## O `total` é dinheiro, e sai por ausência

        É o mesmo número que o `document_total` de uma receção — a adenda dos euros
        da ADR 0031 tirou-o lá e tem de o tirar aqui, ou a decisão do dono vivia
        numa rota e não na outra. As quantidades, a `unit` do papel, a
        `description`, o `supplier_code`, o `ean`, a `vat_rate` e a `confidence`
        continuam a sair para toda a gente: nenhum deles diz quanto custou nada.
      properties:
        state:
          $ref: '#/components/schemas/EstadoDaLeituraEnum'
        confidence:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,3})?$
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
        supplier_name:
          type: string
          maxLength: 200
        supplier_nif:
          type: string
          maxLength: 20
        doc_type:
          type: string
          maxLength: 20
        doc_number:
          type: string
          maxLength: 100
        issued_at:
          type: string
          format: date
          nullable: true
        customer_nif:
          type: string
          maxLength: 20
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        attempt:
          type: integer
        atcud:
          type: string
          maxLength: 50
        fiscal_space:
          type: string
          maxLength: 10
        qr_read:
          type: boolean
        cancelled:
          type: boolean
        divergences:
          type: array
          items:
            $ref: '#/components/schemas/DivergenciaOut'
        vat_checks:
          type: array
          items:
            $ref: '#/components/schemas/ConferenciaDeIvaOut'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LinhaLidaOut'
      required:
      - atcud
      - attempt
      - cancelled
      - confidence
      - customer_nif
      - divergences
      - doc_number
      - doc_type
      - fiscal_space
      - issued_at
      - lines
      - qr_read
      - read_at
      - reason
      - state
      - supplier_name
      - supplier_nif
      - vat_checks
    FechoDeContagemInRequest:
      type: object
      description: |-
        `POST /stock/counts/{id}/closing`: a justificação, **sempre obrigatória**.

        Texto livre e não um enum: uma contagem não cai nos cinco motivos de um
        desperdício, e a razão de uma diferença é quase sempre uma frase ("faltou
        lançar a transferência"). Sem limiar, por decisão do dono (ADR 0030,
        segunda ronda, nº 5).
      properties:
        reason:
          type: string
          minLength: 1
          description: Porque é que esta contagem fecha. Obrigatória.
          maxLength: 200
      required:
      - reason
    FechoDeContagemOut:
      type: object
      description: |-
        O fecho: as diferenças em quantidade e em euros, antes e depois de escrever.

        ## Sem mixin, e isso é uma decisão: aqui o **recurso** é dinheiro

        As duas rotas de `/closing` são de `owner|manager` em `permission_classes` —
        é a assimetria da ADR 0030 — e esses são exactamente os
        `PAPEIS_QUE_VEEM_EUROS`. Quem não vê euros leva 403 antes de este serializer
        correr, logo não há payload a filtrar. O teste
        `test_o_limiar_do_fecho_nao_chega_a_quem_nao_ve_euros` prende as duas listas
        uma à outra e falha no dia em que alguém alargar a rota.

        **Porque é que isto importa, e não é só o `loss_eur`:** o
        `reason_required_above_eur` é hoje `0` e o `reason_required` é por isso
        sempre `True` — um par morto, que não informa nada. Com um limiar ≠ 0 e
        estes dois campos à vista de quem conta, **cada linha passa a limitar um
        custo**: "esta contagem exigiu justificação" é "a diferença vale mais de X
        €", e repetido artigo a artigo é uma busca binária sobre o preço sem nenhuma
        chave de dinheiro no payload. Se um dia o fecho se abrir a quem conta, o
        limiar e a bandeira têm de sair com os euros — não são metadados de
        configuração, são o euro por outro nome.
      properties:
        count:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/EstadoDeContagemEnum'
          readOnly: true
        counted_lines:
          type: integer
          readOnly: true
        total_lines:
          type: integer
          readOnly: true
        differences:
          type: array
          items:
            $ref: '#/components/schemas/LinhaDeContagemOut'
          readOnly: true
        uncounted_lines:
          allOf:
          - $ref: '#/components/schemas/PorContarOut'
          readOnly: true
        loss_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        gain_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        net_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        reason_required_above_eur:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        reason_required:
          type: boolean
          readOnly: true
        closing_role:
          type: string
          readOnly: true
        closing_reason:
          type: string
          readOnly: true
          nullable: true
    FechoDoMesOut:
      type: object
      description: |-
        `GET /reporting/month`. A palavra "lucro" não aparece: o campo é `result_eur`.

        Metade dos campos vai a `null` e as quatro listas vêm vazias, e é a decisão
        1 da ADR 0029: sem `people` não há salários e sem salários não há total de
        gastos nem resultado. Servir zeros era desenhar barras a zero e um rácio a
        0% — o painel optimista que a decisão 7 da ADR 0013 nomeia.
      properties:
        month:
          type: string
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        business_day_starts_at:
          type: string
        closed:
          type: boolean
        days_elapsed:
          type: integer
        days_in_month:
          type: integer
        revenue_net_eur:
          type: string
