    PernaDeTransferenciaOut:
      type: object
      description: |-
        Uma das duas pernas de uma transferência: a saída e a entrada.

        `type` diz qual é (`transfer_out` / `transfer_in`), e as duas trazem a
        localização **de cada uma** — é o par que conta a história, e é por isso que
        o `unit_cost` tinha de desaparecer nas **duas**: escondê-lo só numa delas
        dava o mesmo número pelo outro lado.
      properties:
        movement_id:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          readOnly: true
        location_name:
          type: string
          readOnly: true
        lot_code:
          type: string
          readOnly: true
          nullable: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        cost_status:
          allOf:
          - $ref: '#/components/schemas/EstadoDoCustoEnum'
          readOnly: true
          description: |-
            Qualidade do custo com que o movimento foi avaliado.

            * `conhecido` - conhecido
            * `estimado` - estimado
            * `desconhecido` - desconhecido
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          readOnly: true
          description: Ausente para quem não vê euros.
        type:
          allOf:
          - $ref: '#/components/schemas/PernaDeTransferenciaEnum'
          readOnly: true
