    DivergenciaOut:
      type: object
      description: |-
        Um campo em que o papel e o QR não dizem o mesmo. Três strings, para ler.

        O valor servido no cabeçalho é sempre o do QR; isto é a prova de que ele
        ganhou, e o que o ecrã mostra como *"o papel diz X, o QR diz Y"*.
      properties:
        field:
          type: string
        paper:
          type: string
        qr:
          type: string
      required:
      - field
      - paper
