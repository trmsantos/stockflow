          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        error_code:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ErrorCodeEnum'
