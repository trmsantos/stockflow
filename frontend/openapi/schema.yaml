      - question
      - role_at_time
      - started_at
      - status
      - tool_calls
    MotivoDeAlertaEnum:
      enum:
      - expiry
      - missing
      type: string
      description: |-
        * `expiry` - expiry
        * `missing` - missing
    MotivoDeQuebraEnum:
      enum:
      - expired
      - spoiled
      - prep_loss
      - breakage
      - other
      type: string
      description: |-
        * `expired` - expired
        * `spoiled` - spoiled
        * `prep_loss` - prep_loss
        * `breakage` - breakage
        * `other` - other
    MovementTypeEnum:
      enum:
      - receipt
      - return
      - consumption
      - waste
      - adjustment
      - transfer_out
      - transfer_in
      - production_out
      - production_in
      type: string
      description: |-
        * `receipt` - receipt
        * `return` - return
        * `consumption` - consumption
        * `waste` - waste
        * `adjustment` - adjustment
        * `transfer_out` - transfer_out
        * `transfer_in` - transfer_in
        * `production_out` - production_out
        * `production_in` - production_in
    MovimentoOut:
      type: object
      description: |-
        Uma linha do ledger: `GET /stock/movements` e o 201 da quebra.

        **A mesma forma nas duas portas**, de propósito: o que o 201 devolve é o
        que a lista vai mostrar a seguir, e duas formas do mesmo facto são duas
        oportunidades de divergirem.

        `quantity` vem **com sinal** — entradas positivas, saídas negativas —,
        porque aqui a linha é o ledger e o sinal é o facto. (Na lista de
        desperdício vem positiva: lá a pergunta é "quanto se perdeu".)

        `unit_cost` só sai a `owner|manager`, e vem `null` quando o custo é
        desconhecido: zero não é um preço de zero euros (ADR 0024, decisão 5).

        ## Os dois campos novos da referência, e o uuid que o ecrã não imprime

        O `reference` de um ajuste de fecho é o **id cru da contagem** e o ecrã
        dizia "texto curto, para mostrar". Não se muda o que se grava — há um
        índice parcial e dois lookups por essa string —, servem-se
        `reference_kind` e `reference_label`, e o ecrã imprime o rótulo. O que vier
        de fora deste módulo fica sem rótulo, e sem rótulo o ecrã não imprime nada.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        movement_type:
          allOf:
          - $ref: '#/components/schemas/MovementTypeEnum'
          readOnly: true
        quantity:
          allOf:
          - $ref: '#/components/schemas/QuantidadeOut'
          readOnly: true
        location:
          allOf:
          - $ref: '#/components/schemas/LocalizacaoReferencia'
          readOnly: true
        lot_code:
          type: string
          readOnly: true
          nullable: true
          description: '`null` num lote sintético.'
        reason:
          readOnly: true
          description: |-
            `""` quando o movimento não tem motivo.

            * `expired` - expired
            * `spoiled` - spoiled
            * `prep_loss` - prep_loss
            * `breakage` - breakage
            * `other` - other
          oneOf:
          - $ref: '#/components/schemas/MotivoDeQuebraEnum'
          - $ref: '#/components/schemas/BlankEnum'
        created_by:
          type: string
          readOnly: true
          nullable: true
          description: O `display_name` da pertença, nunca o email. `null` quando
            quem agiu já não tem nome aqui.
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        reference:
          type: string
          readOnly: true
          nullable: true
        reference_kind:
          type: string
          readOnly: true
          nullable: true
        reference_label:
          type: string
          readOnly: true
          nullable: true
        cost_status:
          allOf:
          - $ref: '#/components/schemas/EstadoDoCustoEnum'
          readOnly: true
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
          description: Ausente para quem não vê euros.
    NivelDeStockOut:
      type: object
      description: |-
        Uma linha do `GET /stock/levels`: **um artigo**, somado sobre os lotes.

        Era o `/stock/summary` do servidor e mudou de casa na ADR 0034, decisão 1 —
        o caminho `/stock/summary` ficou livre para os quatro números do cliente. O
        grão de lote vivia no `by-location`/`by-product`, que morreram inteiros por
        não terem consumidor nenhum.

        ## O que sai por papel, e o que nunca sai

        `unit_cost` e `total_value` só vão a `owner|manager` (ADR 0032, decisão 1),
        e vão **os dois juntos**: um reconstrói o outro com a quantidade que já
        está no payload, logo esconder um só é teatro.

        O que fica para toda a gente: a quantidade (as quantidades são o produto),
        o mínimo, o estado, a validade mais próxima, a repartição, e a
        **cobertura** — `quantity_without_cost` é quantidade e não euro, e é o que
        diz se o valor está subestimado em 5 % ou em 95 %.

        A invariante da ADR 0032 continua a fechar ao cêntimo:
        `unit_cost × (quantity − quantity_without_cost) == total_value`, com as
        duas pontas do divisor servidas a quem não vê euros.

        ## `status` e `min_quantity` são **do estabelecimento**, também com `?loja=`

        O mínimo é por artigo (ADR 0024) e compará-lo contra o saldo de uma loja
        inventava faltas. O `?loja=` escopa só `quantity`, `by_location`,
        `nearest_expiry` e o valor. **O ecrã tem de escrever "mínimo do
        estabelecimento"**, senão "0,4 kg · ok" lê-se como erro de cálculo.
      properties:
        product:
          type: string
          format: uuid
          readOnly: true
        short_name:
          type: string
          readOnly: true
        quantity:
          allOf:
          - $ref: '#/components/schemas/QuantidadeOut'
          readOnly: true
        min_quantity:
          allOf:
          - $ref: '#/components/schemas/QuantidadeOut'
          readOnly: true
          description: Do **artigo**, logo do estabelecimento inteiro.
        status:
          allOf:
          - $ref: '#/components/schemas/EstadoDoNivelEnum'
          readOnly: true
        by_location:
          type: array
          items:
            $ref: '#/components/schemas/NivelPorLocalizacaoOut'
          readOnly: true
        nearest_expiry:
          allOf:
          - $ref: '#/components/schemas/ValidadeProximaOut'
          readOnly: true
          nullable: true
        quantity_without_cost:
          allOf:
          - $ref: '#/components/schemas/QuantidadeOut'
          readOnly: true
          description: Quanta desta quantidade está em níveis sem preço registado.
            Zero é cobertura total; igual ao `quantity` é não haver preço nenhum.
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
          description: Custo médio ponderado da quantidade **com** preço — nunca diluído
            pela parte sem preço. NULL quando nenhuma tem. Ausente para quem não vê
            euros.
        total_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          description: Ausente para quem não vê euros.
    NivelPorLocalizacaoOut:
      type: object
      description: |-
        Quanto deste artigo está em cada prateleira. Sem euros, de propósito.

        A repartição é **o produto**: é ela que responde a "onde está?" e é dela
        que o selector de loja do ecrã tira as opções. Localizações a zero não
        entram — uma loja sem nada deste artigo não é um sítio onde ele está.
      properties:
        location:
          allOf:
          - $ref: '#/components/schemas/LocalizacaoReferencia'
          readOnly: true
        quantity:
          allOf:
          - $ref: '#/components/schemas/QuantidadeOut'
          readOnly: true
