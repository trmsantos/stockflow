# Serviços de infraestrutura para desenvolvimento.
#
# Antecipado do passo 6 do kickoff: o passo 4 escreve a primeira migração com
# Row-Level Security, e uma política RLS que não se corre contra Postgres é uma
# política que não se sabe se funciona — com o CLAUDE.md a proibir editar uma
# migração já aplicada. Os serviços da aplicação (backend, worker, frontend,
# proxy) entram no passo 6, com Dockerfiles multi-stage e digests fixados.
#
# Portas do host: ADR 0002 — nenhuma é a default do serviço, para não colidir
# com outros projetos na mesma máquina. Dentro da rede do compose os
# contentores continuam nas portas canónicas (5432, 6379).
name: stockflow

services:
  db:
    # PostgreSQL 16.15 (postgres:16-alpine), fixado por digest — SECURITY.md §8.
    # Para atualizar: docker pull postgres:16-alpine && docker inspect \
    #   --format='{{index .RepoDigests 0}}' postgres:16-alpine
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    command:
      # `log_statement=ddl` deixa ver as migrações a aplicar-se; sem `all`,
      # para os parâmetros das queries não irem para o log (SECURITY.md §1).
      - postgres
      - -c
      - log_statement=ddl
    environment:
      # Superuser de bootstrap do cluster (initdb). **Não** é o role da
      # aplicação: nenhuma app se liga com ele, e não aparece em DATABASE_URL
      # nenhum. Só provisiona (ADR 0006).
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD no .env}
      # Lidas pelo roles.sql quando corre no init dir (volume novo).
      STOCKFLOW_APP_PASSWORD: ${STOCKFLOW_APP_PASSWORD:?define STOCKFLOW_APP_PASSWORD no .env}
      STOCKFLOW_OWNER_PASSWORD: ${STOCKFLOW_OWNER_PASSWORD:?define STOCKFLOW_OWNER_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Num volume novo o init dir corre isto sozinho. Num volume que já existe
      # nunca corre — para esses há o serviço `db-roles` abaixo.
      - ./db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockflow} -d ${POSTGRES_DB:-stockflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    # Redis 7.4.11 (redis:7-alpine), fixado por digest.
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # Sem persistência: é broker e cache de desenvolvimento, não fonte de verdade.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- setup, sob `--profile setup`: não arrancam com um `up` normal ---------

  # Provisiona os três roles do ADR 0006. Idempotente: corre quantas vezes for
  # preciso. É a via para um volume que já existe, e o modelo do que se faz numa
  # base de dados gerida, onde não há init dir.
  #   docker compose --env-file backend/.env -f docker/compose.yml \
  #     --profile setup run --rm db-roles
  db-roles:
    profiles: ["setup"]
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      STOCKFLOW_APP_PASSWORD: ${STOCKFLOW_APP_PASSWORD:?}
      STOCKFLOW_OWNER_PASSWORD: ${STOCKFLOW_OWNER_PASSWORD:?}
    volumes:
      - ./db:/db:ro
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - db
      - -U
      - ${POSTGRES_USER:-stockflow}
      - -d
      - ${POSTGRES_DB:-stockflow}
      - -f
      - /db/roles.sql
    restart: "no"

volumes:
  pgdata:
